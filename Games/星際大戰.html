<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星際大戰：銀河大戰役 (Star Wars: Galactic Dogfight)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03050c;
            font-family: 'Orbitron', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* 星戰風格玻璃擬態面板 */
        .sw-glass {
            background: rgba(10, 16, 32, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.2), inset 0 0 15px rgba(0, 210, 255, 0.1);
        }
        .sw-glass-danger {
            background: rgba(32, 10, 16, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 50, 50, 0.4);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
        }
        .sw-button {
            background: linear-gradient(135deg, rgba(0, 180, 255, 0.3), rgba(0, 90, 180, 0.5));
            border: 1px solid #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
            transition: all 0.2s ease;
        }
        .sw-button:hover {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.5), rgba(0, 120, 230, 0.7));
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
            transform: scale(1.03);
        }
        .sw-button:active {
            transform: scale(0.97);
        }
        .sw-text-glow {
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.8), 0 0 15px rgba(0, 150, 255, 0.5);
        }
        .sw-text-yellow {
            color: #ffe81f;
            text-shadow: 0 0 8px rgba(255, 232, 31, 0.8);
        }
    </style>
</head>
<body class="relative overflow-hidden select-none">

    <!-- 遊戲主要畫布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 頂部懸浮極簡 HUD -->
    <header id="hud" class="fixed top-3 left-1/2 -translate-x-1/2 w-[95%] max-w-5xl z-10 pointer-events-none">
        <div class="sw-glass rounded-xl px-4 py-2 flex flex-wrap items-center justify-between text-xs sm:text-sm font-bold gap-2 pointer-events-auto">
            <!-- 波次 -->
            <div class="flex items-center space-x-1">
                <span class="text-cyan-400">WAVE</span>
                <span id="hudWave" class="text-white text-base font-black">1</span>
            </div>
            <!-- 得分 -->
            <div class="flex items-center space-x-1">
                <span class="text-yellow-400">SCORE</span>
                <span id="hudScore" class="sw-text-yellow text-base font-black">0</span>
            </div>
            <!-- 最高分 -->
            <div class="hidden sm:flex items-center space-x-1">
                <span class="text-gray-400">HIGH</span>
                <span id="hudHighScore" class="text-gray-200 text-base font-bold">0</span>
            </div>
            <!-- 護盾生命值 -->
            <div class="flex items-center space-x-1">
                <span class="text-blue-400">SHIELD</span>
                <div id="hudShield" class="flex items-center space-x-1">
                    <!-- 動態生成護盾條 -->
                </div>
            </div>
            <!-- 控制按鈕群 -->
            <div class="flex items-center space-x-2">
                <button id="btnBgm" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-cyan-500/40 text-sm transition" title="背景音樂">🎵</button>
                <button id="btnSfx" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-cyan-500/40 text-sm transition" title="音效">🔊</button>
                <button id="btnRestart" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-cyan-500/40 text-sm transition" title="重新開始">🔄</button>
            </div>
        </div>
    </header>

    <!-- Boss 血條 HUD (僅 Boss 戰顯示) -->
    <div id="bossHud" class="fixed top-16 left-1/2 -translate-x-1/2 w-[80%] max-w-xl z-10 hidden transition-opacity duration-300">
        <div class="sw-glass-danger rounded-lg p-2 text-center">
            <div class="flex justify-between items-center px-2 mb-1 text-xs font-bold text-red-400 tracking-widest">
                <span>⚠️ IMPERIAL STAR DESTROYER</span>
                <span id="bossHealthText">100%</span>
            </div>
            <div class="w-full bg-gray-950 rounded-full h-3 overflow-hidden border border-red-500/50">
                <div id="bossHealthBar" class="bg-gradient-to-r from-red-600 to-yellow-500 h-full w-full transition-all duration-100 shadow-[0_0_10px_#ff0000]"></div>
            </div>
        </div>
    </div>

    <!-- 主選單 / 開局 Modal -->
    <div id="startModal" class="fixed inset-0 z-20 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="sw-glass rounded-2xl p-6 sm:p-10 max-w-md w-full text-center space-y-6 border border-cyan-400/50 shadow-[0_0_50px_rgba(0,210,255,0.3)]">
            <div class="space-y-2">
                <h2 class="text-xs font-bold text-cyan-400 tracking-[0.3em] uppercase">Star Wars Arcade</h2>
                <h1 class="text-2xl sm:text-3xl font-black tracking-wider text-white sw-text-glow">銀河大戰役</h1>
                <p class="text-xs text-blue-300/80">GALACTIC DOGFIGHT</p>
            </div>

            <div class="text-xs sm:text-sm text-gray-300 space-y-3 leading-relaxed text-left bg-slate-900/60 p-4 rounded-xl border border-blue-900/40">
                <p class="text-cyan-300 font-semibold">【作戰指令】</p>
                <p>🚀 <b>移動</b>：手指/滑鼠拖曳 X-Wing 戰機或使用 WASD / 方向鍵</p>
                <p>💥 <b>射擊</b>：預設自動發射雙發雷射，按住空白鍵可增幅發射</p>
                <p>🛡️ <b>任務</b>：摧毀帝國鈦戰機與旗艦，收集能量膠囊強化戰機！</p>
            </div>

            <button id="btnStartGame" class="sw-button w-full py-3.5 rounded-xl text-lg font-black text-white tracking-widest uppercase cursor-pointer">
                進入戰場 (START)
            </button>
        </div>
    </div>

    <!-- 遊戲結束 Modal -->
    <div id="gameOverModal" class="fixed inset-0 z-20 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md hidden">
        <div class="sw-glass-danger rounded-2xl p-6 sm:p-8 max-w-md w-full text-center space-y-6 border border-red-500/60">
            <div class="space-y-1">
                <h2 class="text-2xl sm:text-3xl font-black text-red-500 tracking-wider shadow-red-500/50 text-shadow">戰機毀滅</h2>
                <p class="text-xs text-red-300/80 tracking-widest">MISSION FAILED</p>
            </div>

            <div class="bg-slate-950/70 p-4 rounded-xl space-y-2 text-sm border border-red-900/40">
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">最終得分</span>
                    <span id="finalScore" class="text-xl font-bold text-yellow-400">0</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">抵達波次</span>
                    <span id="finalWave" class="text-lg font-bold text-cyan-400">1</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">歷史最高</span>
                    <span id="finalHighScore" class="text-lg font-bold text-gray-200">0</span>
                </div>
            </div>

            <button id="btnRetryGame" class="sw-button w-full py-3.5 rounded-xl text-lg font-black text-white tracking-widest uppercase cursor-pointer">
                再次出擊 (RETRY)
            </button>
        </div>
    </div>

    <!-- 遊戲邏輯與聲音引擎 -->
    <script>
        // --- 1. 全域變數與初始化 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // DPR Scaling
        let dpr = window.devicePixelRatio || 1;
        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 遊戲狀態
        const GameState = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let currentState = GameState.MENU;

        let score = 0;
        let wave = 1;
        let highScore = parseInt(localStorage.getItem('sw_high_score') || '0', 10);

        // 音效與音樂開關狀態
        let bgmEnabled = localStorage.getItem('sw_bgm') !== 'false';
        let sfxEnabled = localStorage.getItem('sw_sfx') !== 'false';

        // UI 元素
        const hudWave = document.getElementById('hudWave');
        const hudScore = document.getElementById('hudScore');
        const hudHighScore = document.getElementById('hudHighScore');
        const hudShield = document.getElementById('hudShield');
        const bossHud = document.getElementById('bossHud');
        const bossHealthBar = document.getElementById('bossHealthBar');
        const bossHealthText = document.getElementById('bossHealthText');
        const btnBgm = document.getElementById('btnBgm');
        const btnSfx = document.getElementById('btnSfx');
        const btnRestart = document.getElementById('btnRestart');
        const startModal = document.getElementById('startModal');
        const gameOverModal = document.getElementById('gameOverModal');
        const btnStartGame = document.getElementById('btnStartGame');
        const btnRetryGame = document.getElementById('btnRetryGame');
        const finalScore = document.getElementById('finalScore');
        const finalWave = document.getElementById('finalWave');
        const finalHighScore = document.getElementById('finalHighScore');

        // --- 2. 純 Web Audio API 聲音引擎 ---
        let audioCtx = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 解鎖瀏覽器音訊
        window.addEventListener('click', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });

        // 音效播放系統 (SFX)
        function playSound(type) {
            if (!sfxEnabled || !audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'laser') {
                // 玩家發射雷射音 (高頻下滑)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'enemyLaser') {
                // 敵機雷射音 (低沉下滑)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.14);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.14);
            } else if (type === 'explosion') {
                // 白噪音爆炸音
                const bufferSize = audioCtx.sampleRate * 0.3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.exponentialRampToValueAtTime(40, now + 0.3);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
            } else if (type === 'hit') {
                // 受創聲
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'powerup') {
                // 吃到強化膠囊
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'bossAlert') {
                // Boss 警報
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // BGM 即時合成器 (復古星戰風格進行曲)
        const bgmNotes = [
            110, 110, 110, 146, 220, 196, 185, 164, 293, 220,
            196, 185, 164, 293, 220, 196, 185, 196, 164
        ];
        let bgmIndex = 0;

        function startBgm() {
            stopBgm();
            if (!bgmEnabled || !audioCtx) return;

            bgmInterval = setInterval(() => {
                if (!bgmEnabled || !audioCtx) return;
                const freq = bgmNotes[bgmIndex % bgmNotes.length];
                bgmIndex++;

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.2);
            }, 220);
        }

        function stopBgm() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        // --- 3. 遊戲物件與細緻視覺實體設計 ---

        // 背景動態視差繁星
        class Starfield {
            constructor() {
                this.stars = [];
                this.init();
            }

            init() {
                this.stars = [];
                const count = Math.floor((window.innerWidth * window.innerHeight) / 2500);
                for (let i = 0; i < count; i++) {
                    this.stars.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        size: Math.random() * 2 + 0.5,
                        speed: Math.random() * 3.5 + 0.5,
                        color: Math.random() > 0.85 ? '#00e5ff' : (Math.random() > 0.92 ? '#ffe81f' : '#ffffff'),
                        alpha: Math.random() * 0.8 + 0.2
                    });
                }
            }

            update() {
                const height = window.innerHeight;
                const width = window.innerWidth;
                this.stars.forEach(star => {
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                });
            }

            draw() {
                this.stars.forEach(star => {
                    ctx.fillStyle = star.color;
                    ctx.globalAlpha = star.alpha;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                });
                ctx.globalAlpha = 1.0;
            }
        }

        // 離子雷射子彈類別
        class Bullet {
            constructor(x, y, vx, vy, color = '#ff2244', isPlayer = true) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.isPlayer = isPlayer;
                this.width = 4;
                this.height = 14;
                this.markedForDeletion = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y < -20 || this.y > window.innerHeight + 20 ||
                    this.x < -20 || this.x > window.innerWidth + 20) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
                ctx.restore();
            }
        }

        // 玩家精緻戰鬥機 (卡通噴射機風格：深藍+橘黃塗裝+紅頂機鼻)
        class Player {
            constructor() {
                this.width = 50;
                this.height = 65;
                this.x = window.innerWidth / 2;
                this.y = window.innerHeight - 100;
                this.targetX = this.x;
                this.targetY = this.y;
                this.speed = 0.22; // 拖曳平滑度
                this.maxShield = 5;
                this.shield = this.maxShield;
                this.lastShotTime = 0;
                this.shootInterval = 170; // 發射間隔(ms)

                // 強化狀態
                this.tripleLaserTimer = 0;
                this.energyShieldActive = false;
                this.hyperSpeedTimer = 0;
            }

            update(deltaTime) {
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;

                // 邊界限制
                const hudHeight = 70;
                this.x = Math.max(this.width / 2, Math.min(window.innerWidth - this.width / 2, this.x));
                this.y = Math.max(hudHeight + this.height / 2, Math.min(window.innerHeight - this.height / 2, this.y));

                if (this.tripleLaserTimer > 0) this.tripleLaserTimer -= deltaTime;
                if (this.hyperSpeedTimer > 0) this.hyperSpeedTimer -= deltaTime;

                // 動態推進器火花粒子供給
                if (Math.random() < 0.6) {
                    particles.push(new EngineParticle(this.x, this.y + 30, '#ff6600'));
                }

                // 自動發射子彈
                const actualInterval = this.hyperSpeedTimer > 0 ? this.shootInterval / 2.2 : this.shootInterval;
                const now = Date.now();
                if (now - this.lastShotTime > actualInterval) {
                    this.shoot();
                    this.lastShotTime = now;
                }
            }

            shoot() {
                playSound('laser');
                if (this.tripleLaserTimer > 0) {
                    // 三向散射
                    bullets.push(new Bullet(this.x - 22, this.y - 12, -2, -15, '#ff2255', true));
                    bullets.push(new Bullet(this.x - 18, this.y - 20, 0, -16, '#ff2255', true));
                    bullets.push(new Bullet(this.x + 18, this.y - 20, 0, -16, '#ff2255', true));
                    bullets.push(new Bullet(this.x + 22, this.y - 12, 2, -15, '#ff2255', true));
                } else {
                    // 翼尖雙發紅光離子雷射
                    bullets.push(new Bullet(this.x - 24, this.y - 10, 0, -16, '#ff2244', true));
                    bullets.push(new Bullet(this.x + 24, this.y - 10, 0, -16, '#ff2244', true));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // 1. 推進器尾焰 (中央噴氣嘴)
                const flameLen = Math.random() * 16 + 12;
                const grad = ctx.createLinearGradient(0, 26, 0, 26 + flameLen);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#ff6600');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(-4, 26, 8, flameLen);

                // 2. 主機翼 (橘色+黃色前傾翼)
                ctx.fillStyle = '#ff9900';
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 1.5;

                // 左大翼
                ctx.beginPath();
                ctx.moveTo(-6, -5);
                ctx.lineTo(-26, 12);
                ctx.lineTo(-24, 18);
                ctx.lineTo(-6, 8);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // 右大翼
                ctx.beginPath();
                ctx.moveTo(6, -5);
                ctx.lineTo(26, 12);
                ctx.lineTo(24, 18);
                ctx.lineTo(6, 8);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // 翼面黃色閃電拉花裝飾
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.moveTo(-10, 0); ctx.lineTo(-22, 10); ctx.lineTo(-15, 12);
                ctx.closePath(); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(10, 0); ctx.lineTo(22, 10); ctx.lineTo(15, 12);
                ctx.closePath(); ctx.fill();

                // 尾翼
                ctx.fillStyle = '#ff9900';
                ctx.beginPath();
                ctx.moveTo(-6, 16); ctx.lineTo(-16, 26); ctx.lineTo(-6, 24);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(6, 16); ctx.lineTo(16, 26); ctx.lineTo(6, 24);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                // 3. 翼端導彈/雷射發射器 (深灰+紅色頭部)
                ctx.fillStyle = '#64748b';
                ctx.fillRect(-26, -12, 3, 28);
                ctx.fillRect(23, -12, 3, 28);
                ctx.fillStyle = '#ff3300';
                ctx.fillRect(-26, -15, 3, 5);
                ctx.fillRect(23, -15, 3, 5);

                // 4. 深藍色鋼鐵流線機身
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -32); // 機鼻點
                ctx.bezierCurveTo(7, -15, 8, 10, 6, 28);
                ctx.lineTo(-6, 28);
                ctx.bezierCurveTo(-8, 10, -7, -15, 0, -32);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // 機身深藍/灰藍分色中線
                ctx.fillStyle = '#334155';
                ctx.beginPath();
                ctx.moveTo(0, -25); ctx.lineTo(4, 5); ctx.lineTo(4, 26); ctx.lineTo(-4, 26); ctx.lineTo(-4, 5);
                ctx.closePath(); ctx.fill();

                // 5. 鮮紅色機鼻尖端
                const noseGrad = ctx.createLinearGradient(0, -32, 0, -20);
                noseGrad.addColorStop(0, '#ff2200');
                noseGrad.addColorStop(1, '#ff6600');
                ctx.fillStyle = noseGrad;
                ctx.beginPath();
                ctx.moveTo(0, -32);
                ctx.lineTo(3.5, -20);
                ctx.lineTo(-3.5, -20);
                ctx.closePath();
                ctx.fill();

                // 6. 駕駛艙玻璃罩 (藍色弧形透鏡高光)
                const glassGrad = ctx.createLinearGradient(0, -18, 0, -4);
                glassGrad.addColorStop(0, '#a5f3fc');
                glassGrad.addColorStop(0.5, '#0284c7');
                glassGrad.addColorStop(1, '#0c4a6e');
                ctx.fillStyle = glassGrad;
                ctx.strokeStyle = '#e0f2fe';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(0, -11, 3.5, 8, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                // 7. 護盾防禦光罩
                if (this.energyShieldActive) {
                    ctx.strokeStyle = '#00e5ff';
                    ctx.shadowColor = '#00e5ff';
                    ctx.shadowBlur = 16;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, 36, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // 外星飛碟敵機類別 (經典卡通 UFO 圓盤風格)
        class Enemy {
            constructor(type = 'tie') {
                this.type = type; // 'tie': 普通小飛碟, 'bomber': 重型戰鬥飛碟
                this.width = type === 'tie' ? 52 : 68;
                this.height = type === 'tie' ? 32 : 42;
                this.x = Math.random() * (window.innerWidth - 120) + 60;
                this.y = -60;
                this.hp = type === 'tie' ? 1 : 3;
                this.maxHp = this.hp;
                this.speedY = type === 'tie' ? Math.random() * 1.6 + 2.2 : Math.random() * 0.9 + 1.3;
                this.speedX = (Math.random() - 0.5) * 1.8;
                this.markedForDeletion = false;
                this.lastShotTime = Date.now() + Math.random() * 800;
                this.shootInterval = type === 'tie' ? 1400 : 950;
                this.lightAnim = Math.random() * 10;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.lightAnim += 0.1;

                // 左右邊界反彈
                if (this.x < 35 || this.x > window.innerWidth - 35) {
                    this.speedX *= -1;
                }

                if (this.y > window.innerHeight + 60) {
                    this.markedForDeletion = true;
                }

                // 發射綠色/紅色雷射
                const now = Date.now();
                if (now - this.lastShotTime > this.shootInterval && this.y > 60 && this.y < window.innerHeight - 120) {
                    this.shoot();
                    this.lastShotTime = now;
                }
            }

            shoot() {
                playSound('enemyLaser');
                if (this.type === 'tie') {
                    bullets.push(new Bullet(this.x, this.y + 12, 0, 7, '#00ff66', false));
                } else {
                    bullets.push(new Bullet(this.x - 16, this.y + 14, -0.6, 6, '#00ff66', false));
                    bullets.push(new Bullet(this.x + 16, this.y + 14, 0.6, 6, '#00ff66', false));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'tie') {
                    // 1. 卡通風格外星飛碟 (UFO)
                    ctx.shadowColor = '#00e5ff';
                    ctx.shadowBlur = 4;

                    // 底座/裙邊 (銀灰金屬光澤)
                    const baseGrad = ctx.createLinearGradient(0, -8, 0, 12);
                    baseGrad.addColorStop(0, '#94a3b8');
                    baseGrad.addColorStop(0.5, '#cbd5e1');
                    baseGrad.addColorStop(1, '#475569');
                    ctx.fillStyle = baseGrad;
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 1.5;

                    ctx.beginPath();
                    ctx.ellipse(0, 3, 24, 9, 0, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();

                    // 飛碟金屬紅綠跑馬燈環邊
                    ctx.strokeStyle = '#22c55e';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(0, 5, 22, 5, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // 發光彩燈 (紅/黃/綠燈泡點綴)
                    const colors = ['#ef4444', '#eab308', '#22c55e', '#06b6d4', '#ef4444'];
                    for (let i = 0; i < 5; i++) {
                        const angle = (i / 5) * Math.PI - Math.PI / 2;
                        const lx = Math.sin(angle) * 18;
                        const ly = Math.cos(angle) * 4 + 4;
                        ctx.fillStyle = colors[(i + Math.floor(this.lightAnim)) % colors.length];
                        ctx.beginPath();
                        ctx.arc(lx, ly, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 中央玻璃圓頂半球 (Glass Dome)
                    const domeGrad = ctx.createLinearGradient(0, -14, 0, -2);
                    domeGrad.addColorStop(0, '#e0f2fe');
                    domeGrad.addColorStop(0.6, '#38bdf8');
                    domeGrad.addColorStop(1, '#0284c7');
                    ctx.fillStyle = domeGrad;
                    ctx.strokeStyle = '#e2e8f0';
                    ctx.lineWidth = 1.2;

                    ctx.beginPath();
                    ctx.arc(0, -2, 11, Math.PI, 0);
                    ctx.closePath();
                    ctx.fill(); ctx.stroke();

                    // 圓頂小觀察窗細節
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-4, -6, 2, 0, Math.PI * 2);
                    ctx.fill();

                } else {
                    // 2. 大型重型外星戰術飛碟 (Heavy UFO)
                    ctx.shadowColor = '#ff2255';
                    ctx.shadowBlur = 6;

                    // 底部大盤體 (漸層灰金屬)
                    const saucerGrad = ctx.createLinearGradient(0, -12, 0, 16);
                    saucerGrad.addColorStop(0, '#64748b');
                    saucerGrad.addColorStop(0.5, '#94a3b8');
                    saucerGrad.addColorStop(1, '#1e293b');
                    ctx.fillStyle = saucerGrad;
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    ctx.ellipse(0, 4, 32, 12, 0, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();

                    // 亮紅色中心線圈條
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(0, 6, 30, 7, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // 七顆發光彩燈陣列
                    const colors = ['#06b6d4', '#eab308', '#ef4444', '#22c55e'];
                    for (let i = 0; i < 7; i++) {
                        const lx = -22 + i * 7.3;
                        const ly = 6 + Math.sin(i + this.lightAnim) * 1.5;
                        ctx.fillStyle = colors[(i + Math.floor(this.lightAnim * 1.5)) % colors.length];
                        ctx.beginPath();
                        ctx.arc(lx, ly, 2.2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 大型加厚上圓塔
                    const domeGrad = ctx.createLinearGradient(0, -18, 0, -2);
                    domeGrad.addColorStop(0, '#cbd5e1');
                    domeGrad.addColorStop(1, '#475569');
                    ctx.fillStyle = domeGrad;
                    ctx.strokeStyle = '#0284c7';
                    ctx.lineWidth = 1.5;

                    ctx.beginPath();
                    ctx.arc(0, -2, 16, Math.PI, 0);
                    ctx.closePath();
                    ctx.fill(); ctx.stroke();

                    // 半球小窗口透視
                    for (let a = -2; a <= 2; a++) {
                        ctx.fillStyle = '#38bdf8';
                        ctx.beginPath();
                        ctx.arc(a * 6, -8, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }
        }

        // 外星母艦 Boss: Star Destroyer / Giant Alien Mothership
        class StarDestroyerBoss {
            constructor() {
                this.width = 280;
                this.height = 140;
                this.x = window.innerWidth / 2;
                this.y = -180;
                this.targetY = 130;
                this.maxHp = 140 + wave * 35;
                this.hp = this.maxHp;
                this.speedX = 1.8;
                this.markedForDeletion = false;
                this.lastShotTime = Date.now();
                this.animTick = 0;
            }

            update() {
                this.animTick += 0.08;
                // 入場動畫
                if (this.y < this.targetY) {
                    this.y += 1.6;
                    return;
                }

                // 左右巡航
                this.x += this.speedX;
                if (this.x < this.width / 2 + 20 || this.x > window.innerWidth - this.width / 2 - 20) {
                    this.speedX *= -1;
                }

                // 彈幕攻擊機制
                const now = Date.now();
                if (now - this.lastShotTime > 750) {
                    this.shoot();
                    this.lastShotTime = now;
                }

                // 更新 Boss 血條 UI
                bossHud.classList.remove('hidden');
                const pct = Math.max(0, Math.floor((this.hp / this.maxHp) * 100));
                bossHealthBar.style.width = `${pct}%`;
                bossHealthText.textContent = `${pct}%`;
            }

            shoot() {
                playSound('enemyLaser');
                // 多道散射打擊
                bullets.push(new Bullet(this.x - 75, this.y + 25, -1.2, 6.5, '#ff0033', false));
                bullets.push(new Bullet(this.x - 25, this.y + 35, -0.4, 7, '#ff0033', false));
                bullets.push(new Bullet(this.x + 25, this.y + 35, 0.4, 7, '#ff0033', false));
                bullets.push(new Bullet(this.x + 75, this.y + 25, 1.2, 6.5, '#ff0033', false));
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // 1. 巨大外星 UFO 母艦盤體繪製
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 15;

                // 主幾何飛碟銀色大外框
                const mainGrad = ctx.createLinearGradient(0, -40, 0, 40);
                mainGrad.addColorStop(0, '#e2e8f0');
                mainGrad.addColorStop(0.5, '#94a3b8');
                mainGrad.addColorStop(1, '#1e293b');
                ctx.fillStyle = mainGrad;
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 3;

                ctx.beginPath();
                ctx.ellipse(0, 5, 130, 42, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                // 赤道位置發光跑馬燈帶
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(0, 10, 125, 24, 0, 0, Math.PI * 2);
                ctx.stroke();

                // 跑馬燈點陣 (12 顆連續變色光點)
                const colors = ['#ef4444', '#eab308', '#22c55e', '#06b6d4'];
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2 + this.animTick;
                    const lx = Math.cos(angle) * 115;
                    const ly = Math.sin(angle) * 20 + 10;
                    ctx.fillStyle = colors[(i + Math.floor(this.animTick * 2)) % colors.length];
                    ctx.beginPath();
                    ctx.arc(lx, ly, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 2. 巨大半球形金屬圓頂艙
                const domeGrad = ctx.createLinearGradient(0, -55, 0, -10);
                domeGrad.addColorStop(0, '#f8fafc');
                domeGrad.addColorStop(0.7, '#64748b');
                domeGrad.addColorStop(1, '#334155');
                ctx.fillStyle = domeGrad;
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.arc(0, -10, 65, Math.PI, 0);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // 圓頂景觀窗環陣
                for (let a = -4; a <= 4; a++) {
                    ctx.fillStyle = '#38bdf8';
                    ctx.shadowColor = '#00e5ff';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(a * 13, -32, 5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 3. 底部發光漩渦離子牽引光束發射口
                ctx.fillStyle = '#00e5ff';
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.ellipse(0, 32, 35, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // 掉落能量膠囊 (Power-ups)
        class PowerUp {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 18;
                this.speedY = 1.4;
                this.markedForDeletion = false;
                // 1: 三向雷射, 2: 護盾膜, 3: 光速暴擊
                const rand = Math.random();
                if (rand < 0.4) this.type = 'laser';
                else if (rand < 0.75) this.type = 'shield';
                else this.type = 'speed';
            }

            update() {
                this.y += this.speedY;
                if (this.y > window.innerHeight + 30) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                let color = '#ff0055';
                let icon = '🔴';
                if (this.type === 'shield') { color = '#00e5ff'; icon = '🛡️'; }
                if (this.type === 'speed') { color = '#ffe81f'; icon = '⚡'; }

                ctx.shadowColor = color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icon, 0, 1);

                ctx.restore();
            }
        }

        // 推進器離子粒子
        class EngineParticle {
            constructor(x, y, color) {
                this.x = x + (Math.random() - 0.5) * 4;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 2.5 + 1;
                this.vy = Math.random() * 3 + 2;
                this.alpha = 1.0;
                this.decay = Math.random() * 0.08 + 0.04;
                this.markedForDeletion = false;
            }

            update() {
                this.y += this.vy;
                this.alpha -= this.decay;
                if (this.alpha <= 0) this.markedForDeletion = true;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 4;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        // 爆裂幾何粒子特效
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 3.5 + 1.5;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5.5 + 1.2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1.0;
                this.decay = Math.random() * 0.03 + 0.015;
                this.markedForDeletion = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                if (this.alpha <= 0) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        // --- 4. 遊戲主邏輯管理 ---
        let starfield = new Starfield();
        let player = new Player();
        let bullets = [];
        let enemies = [];
        let powerUps = [];
        let particles = [];
        let currentBoss = null;

        let enemySpawnTimer = 0;
        let enemiesToSpawnInWave = 10;
        let enemiesSpawnedSoFar = 0;

        function createExplosion(x, y, color = '#ff6600', count = 22) {
            playSound('explosion');
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function updateHUD() {
            hudWave.textContent = wave;
            hudScore.textContent = score;
            hudHighScore.textContent = highScore;

            // 動態護盾顆數繪製
            hudShield.innerHTML = '';
            for (let i = 0; i < player.maxShield; i++) {
                const shieldIcon = document.createElement('span');
                shieldIcon.className = i < player.shield ? 'text-blue-400 text-sm' : 'text-gray-600 text-sm opacity-40';
                shieldIcon.textContent = '🛡️';
                hudShield.appendChild(shieldIcon);
            }
        }

        function startNextWave() {
            wave++;
            enemiesSpawnedSoFar = 0;
            enemiesToSpawnInWave = 8 + wave * 4;
            updateHUD();

            // 每 3 波出現 Boss 戰
            if (wave % 3 === 0) {
                playSound('bossAlert');
                currentBoss = new StarDestroyerBoss();
            }
        }

        function resetGame() {
            score = 0;
            wave = 1;
            player = new Player();
            bullets = [];
            enemies = [];
            powerUps = [];
            particles = [];
            currentBoss = null;
            enemiesSpawnedSoFar = 0;
            enemiesToSpawnInWave = 12;

            bossHud.classList.add('hidden');
            updateHUD();
        }

        // --- 5. 碰撞偵測 (AABB) ---
        function checkCollisions() {
            // 1. 玩家子彈撞擊一般敵機
            bullets.forEach(b => {
                if (!b.isPlayer || b.markedForDeletion) return;

                enemies.forEach(e => {
                    if (e.markedForDeletion) return;
                    if (Math.abs(b.x - e.x) < e.width / 2 && Math.abs(b.y - e.y) < e.height / 2) {
                        b.markedForDeletion = true;
                        e.hp--;
                        createExplosion(b.x, b.y, '#00e5ff', 5);

                        if (e.hp <= 0) {
                            e.markedForDeletion = true;
                            createExplosion(e.x, e.y, '#ff6600', 20);
                            score += e.type === 'tie' ? 100 : 300;
                            if (score > highScore) {
                                highScore = score;
                                localStorage.setItem('sw_high_score', highScore);
                            }
                            updateHUD();

                            // 機率掉落能量寶物
                            if (Math.random() < 0.28) {
                                powerUps.push(new PowerUp(e.x, e.y));
                            }
                        }
                    }
                });

                // 2. 玩家子彈撞擊 Boss
                if (currentBoss && !currentBoss.markedForDeletion) {
                    if (Math.abs(b.x - currentBoss.x) < currentBoss.width / 2 && Math.abs(b.y - currentBoss.y) < currentBoss.height / 2) {
                        b.markedForDeletion = true;
                        currentBoss.hp--;
                        createExplosion(b.x, b.y, '#ffe81f', 6);

                        if (currentBoss.hp <= 0) {
                            currentBoss.markedForDeletion = true;
                            createExplosion(currentBoss.x, currentBoss.y, '#ff0000', 65);
                            bossHud.classList.add('hidden');
                            score += 2000;
                            if (score > highScore) {
                                highScore = score;
                                localStorage.setItem('sw_high_score', highScore);
                            }
                            startNextWave();
                        }
                    }
                }
            });

            // 3. 敵機子彈撞擊玩家戰機
            bullets.forEach(b => {
                if (b.isPlayer || b.markedForDeletion) return;

                if (Math.abs(b.x - player.x) < player.width / 2.2 && Math.abs(b.y - player.y) < player.height / 2.2) {
                    b.markedForDeletion = true;
                    handlePlayerDamage();
                }
            });

            // 4. 敵機機身撞擊玩家戰機
            enemies.forEach(e => {
                if (e.markedForDeletion) return;
                if (Math.abs(e.x - player.x) < (e.width + player.width) / 2.5 &&
                    Math.abs(e.y - player.y) < (e.height + player.height) / 2.5) {
                    e.markedForDeletion = true;
                    createExplosion(e.x, e.y, '#ff4400', 16);
                    handlePlayerDamage();
                }
            });

            // 5. 玩家吃到強化寶物
            powerUps.forEach(p => {
                if (p.markedForDeletion) return;
                if (Math.abs(p.x - player.x) < player.width / 2 + p.size &&
                    Math.abs(p.y - player.y) < player.height / 2 + p.size) {
                    p.markedForDeletion = true;
                    playSound('powerup');
                    score += 150;
                    updateHUD();

                    if (p.type === 'laser') player.tripleLaserTimer = 10000; // 10秒三向雷射
                    if (p.type === 'shield') player.energyShieldActive = true;
                    if (p.type === 'speed') player.hyperSpeedTimer = 8000;  // 8秒暴擊
                }
            });
        }

        function handlePlayerDamage() {
            playSound('hit');

            if (player.energyShieldActive) {
                player.energyShieldActive = false; // 護盾膜抵擋一次致命傷害
                createExplosion(player.x, player.y, '#00e5ff', 16);
                return;
            }

            player.shield--;
            createExplosion(player.x, player.y, '#ff0033', 16);
            updateHUD();

            if (player.shield <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            currentState = GameState.GAMEOVER;
            createExplosion(player.x, player.y, '#ff0000', 50);
            stopBgm();

            finalScore.textContent = score;
            finalWave.textContent = wave;
            finalHighScore.textContent = highScore;
            gameOverModal.classList.remove('hidden');
        }

        // --- 6. 主渲染循環與對時邏輯 ---
        let lastTime = 0;

        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // 清空畫布
            ctx.fillStyle = '#03050c';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // 背景繁星滾動
            starfield.update();
            starfield.draw();

            if (currentState === GameState.PLAYING) {
                // 生成普通敵機
                if (!currentBoss && enemiesSpawnedSoFar < enemiesToSpawnInWave) {
                    enemySpawnTimer += deltaTime;
                    if (enemySpawnTimer > 900 - Math.min(500, wave * 40)) {
                        enemies.push(new Enemy(Math.random() > 0.35 ? 'tie' : 'bomber'));
                        enemiesSpawnedSoFar++;
                        enemySpawnTimer = 0;
                    }
                }

                // 當波次敵機全滅且無 Boss 時，進入下一波
                if (!currentBoss && enemiesSpawnedSoFar >= enemiesToSpawnInWave && enemies.length === 0) {
                    startNextWave();
                }

                // 更新與繪製物件
                player.update(deltaTime);
                player.draw();

                if (currentBoss) {
                    currentBoss.update();
                    currentBoss.draw();
                }

                bullets.forEach(b => { b.update(); b.draw(); });
                enemies.forEach(e => { e.update(); e.draw(); });
                powerUps.forEach(p => { p.update(); p.draw(); });
                particles.forEach(pt => { pt.update(); pt.draw(); });

                // 碰撞檢查
                checkCollisions();

                // 清理標記刪除物件
                bullets = bullets.filter(b => !b.markedForDeletion);
                enemies = enemies.filter(e => !e.markedForDeletion);
                powerUps = powerUps.filter(p => !p.markedForDeletion);
                particles = particles.filter(pt => !pt.markedForDeletion);
            }

            requestAnimationFrame(gameLoop);
        }

        // --- 7. 控制與事件監聽 ---

        // 觸控與滑鼠即時拖曳
        function handleMove(e) {
            if (currentState !== GameState.PLAYING) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            player.targetX = clientX;
            player.targetY = clientY;
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, { passive: true });

        // 鍵盤備用支援 (WASD / 方向鍵)
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space' && currentState === GameState.PLAYING) {
                player.shoot();
            }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function processKeyboardInput() {
            if (currentState !== GameState.PLAYING) return;
            const step = 8;
            if (keys['ArrowLeft'] || keys['KeyA']) player.targetX -= step;
            if (keys['ArrowRight'] || keys['KeyD']) player.targetX += step;
            if (keys['ArrowUp'] || keys['KeyW']) player.targetY -= step;
            if (keys['ArrowDown'] || keys['KeyS']) player.targetY += step;
        }
        setInterval(processKeyboardInput, 16);

        // 按鈕控制事件綁定
        btnStartGame.addEventListener('click', () => {
            startModal.classList.add('hidden');
            currentState = GameState.PLAYING;
            resetGame();
            startBgm();
        });

        btnRetryGame.addEventListener('click', () => {
            gameOverModal.classList.add('hidden');
            currentState = GameState.PLAYING;
            resetGame();
            startBgm();
        });

        btnRestart.addEventListener('click', () => {
            if (currentState === GameState.PLAYING) {
                resetGame();
            }
        });

        // 音樂 / 音效開關
        btnBgm.addEventListener('click', () => {
            bgmEnabled = !bgmEnabled;
            localStorage.setItem('sw_bgm', bgmEnabled);
            btnBgm.style.opacity = bgmEnabled ? '1.0' : '0.4';
            if (bgmEnabled) startBgm();
            else stopBgm();
        });

        btnSfx.addEventListener('click', () => {
            sfxEnabled = !sfxEnabled;
            localStorage.setItem('sw_sfx', sfxEnabled);
            btnSfx.style.opacity = sfxEnabled ? '1.0' : '0.4';
        });

        // 初始化 UI 開關顯示
        btnBgm.style.opacity = bgmEnabled ? '1.0' : '0.4';
        btnSfx.style.opacity = sfxEnabled ? '1.0' : '0.4';

        // 啟動主繪製 loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
