const SUIT_CODE={wa:"wands",cu:"cups",sw:"swords",pe:"pentacles"};
const RANK_CODE={ac:0,"02":1,"03":2,"04":3,"05":4,"06":5,"07":6,"08":7,"09":8,"10":9,pa:10,kn:11,qu:12,ki:13};
function idFromShort(s){
  if(s.startsWith("ar")) return "M"+parseInt(s.slice(2),10);
  return SUIT_CODE[s.slice(0,2)]+RANK_CODE[s.slice(2)];
}
const API_DATA={}; // id -> API 回傳的卡片資料
function absorbApi(cards){cards.forEach(a=>{API_DATA[idFromShort(a.name_short)]=a;});}
absorbApi(API_SNAPSHOT);
let apiLive=false;
async function fetchApiDeck(){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),5000);
  try{
    const r=await fetch(`${API_BASE}/cards/random?n=78`,{signal:ctrl.signal});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(); clearTimeout(t);
    if(!j.cards||j.cards.length!==78) throw new Error("bad data");
    absorbApi(j.cards); apiLive=true;
    return j.cards.map(a=>idFromShort(a.name_short)); // API 已隨機排序
  }catch(e){
    clearTimeout(t); apiLive=false;
    const ids=API_SNAPSHOT.map(a=>idFromShort(a.name_short));
    for(let i=ids.length-1;i>0;i--){const j=rand(i+1);[ids[i],ids[j]]=[ids[j],ids[i]];}
    return ids;
  }
}
function setBadge(){
  const b=$("#srcBadge"); b.classList.toggle("live",apiLive);
  b.innerHTML=apiLive?`<i></i>已即時連線 Tarot API（tarotapi.dev）`:`<i></i>此環境無法連外，已改用內建 Tarot API 資料快照`;
}
async function shuffle(){
  const ids=await fetchApiDeck(); setBadge();
  return ids.map(id=>({card:DECK.find(c=>c.id===id),rev:st.rev&&rand(2)===1}));
}
function apiDetails(c,rev){
  const a=API_DATA[c.id]; if(!a) return "";
  const esc=s=>String(s||"").replace(/[<>&]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]));
  return `<details class="api"><summary>📜 偉特原典（Tarot API：${esc(a.name)}／${esc(a.name_short)}）</summary>
    <p><b>${rev===undefined?"正位":rev?"逆位":"正位"}原文：</b>${esc(rev?a.meaning_rev:a.meaning_up)}</p>
    ${rev===undefined?`<p><b>逆位原文：</b>${esc(a.meaning_rev)}</p>`:""}
    <p><b>牌面描述：</b>${esc(a.desc)}</p></details>`;
}

/* 牌陣選擇 */
function renderSpreads(){
  $("#spreads").innerHTML=Object.entries(SPREADS).map(([k,s])=>
    `<div class="sp ${k===st.spread?'on':''}" data-k="${k}"><em>${s.count} 張</em><b>${s.name}</b><span>${s.desc}</span></div>`).join("");
  document.querySelectorAll(".sp").forEach(el=>el.onclick=()=>{st.spread=el.dataset.k;renderSpreads();});
}
renderSpreads();

/* 開始 */
$("#startBtn").onclick=async()=>{
  st.q=$("#q").value.trim(); st.topic=$("#topic").value; st.rev=$("#rev").checked;
  if(st.spread==="love") st.topic="love";
  const btn=$("#startBtn"); btn.disabled=true; btn.textContent="✦ 正在連線 Tarot API 洗牌中…";
  st.deck=await shuffle(); st.picked=[]; st.flipped=0;
  btn.disabled=false; btn.textContent="✦ 呼叫 Tarot API 洗牌並開始抽牌";
  $("#setup").classList.add("hidden"); $("#drawStage").classList.remove("hidden");
  $("#reading").innerHTML=""; $("#flipAllBtn").style.display="none"; $("#autoBtn").style.display="";
  renderArea(); renderFan(); updateHint();
  window.scrollTo({top:0,behavior:"smooth"});
};

function renderFan(){
  const fan=$("#fan");
  fan.innerHTML=st.deck.map((_,i)=>`<div class="fcard" data-i="${i}" style="--dx:${rand(30)-15}px;--dy:${rand(16)-8}px;--dr:${rand(14)-7}deg;animation-delay:${rand(300)}ms"><img src="${BACK_URI}" alt=""></div>`).join("");
  fan.classList.add("shuffling");
  setTimeout(()=>fan.classList.remove("shuffling"),1600);
  fan.querySelectorAll(".fcard").forEach(el=>el.onclick=()=>pick(+el.dataset.i,el));
  const wrap=fan.parentElement; setTimeout(()=>{wrap.scrollLeft=(wrap.scrollWidth-wrap.clientWidth)/2;},50);
}
function updateHint(){
  const sp=SPREADS[st.spread], n=st.picked.length;
  if(n<sp.count) $("#drawHint").innerHTML=`請靜心默念你的問題，憑直覺從牌堆中抽出 <b>${sp.count}</b> 張牌（已抽 <b>${n}</b> / ${sp.count}）`;
  else if(st.flipped<sp.count) $("#drawHint").innerHTML=`抽牌完成 ✦ 點擊牌面逐一翻開，感受每張牌帶給你的第一印象`;
  else $("#drawHint").innerHTML=`所有牌已揭曉，往下閱讀完整解牌 ↓`;
}
function pick(i,el){
  const sp=SPREADS[st.spread]; if(st.picked.length>=sp.count) return;
  el.classList.add("taken");
  const idx=st.picked.length; st.picked.push(st.deck[i]);
  placeCard(idx);
  updateHint();
  if(st.picked.length===sp.count){ $("#autoBtn").style.display="none"; $("#flipAllBtn").style.display=""; }
}
$("#autoBtn").onclick=()=>{
  const sp=SPREADS[st.spread];
  const avail=[...document.querySelectorAll(".fcard:not(.taken)")];
  let need=sp.count-st.picked.length, t=0;
  while(need-- >0){
    const k=rand(avail.length); const el=avail.splice(k,1)[0];
    setTimeout(()=>pick(+el.dataset.i,el),t); t+=220;
  }
};
$("#flipAllBtn").onclick=()=>{
  document.querySelectorAll("#area .tcard:not(.flipped)").forEach((el,k)=>setTimeout(()=>el.click(),k*180));
};

function slotHTML(i,p){return `<div class="slot s${i}" id="slot${i}"><div class="ph">${i+1}</div><div class="cap"><b>${i+1}</b>${p.t}</div></div>`;}
function renderArea(){
  const sp=SPREADS[st.spread], a=$("#area");
  a.className="area "+sp.layout;
  if(sp.layout==="celtic"){
    a.innerHTML=`<div class="cross">${[0,1,2,3,4,5].map(i=>slotHTML(i,sp.pos[i])).join("")}</div><div class="staff">${[6,7,8,9].map(i=>slotHTML(i,sp.pos[i])).join("")}</div>`;
    a.querySelector(".s0 .cap").innerHTML=`<b>1</b>現況 ／ <b>2</b>挑戰（橫置）`;
  }else if(sp.layout==="choice"){
    a.innerHTML=slotHTML(0,sp.pos[0])+`<div class="choice-col">${slotHTML(1,sp.pos[1])}${slotHTML(2,sp.pos[2])}</div><div class="choice-col">${slotHTML(3,sp.pos[3])}${slotHTML(4,sp.pos[4])}</div>`;
  }else{
    a.innerHTML=sp.pos.map((p,i)=>slotHTML(i,p)).join("");
  }
}
function placeCard(i){
  const e=st.picked[i], slot=$("#slot"+i);
  const d=document.createElement("div");
  d.className="tcard deal";
  d.innerHTML=`<div class="inner"><div class="side back"><img src="${BACK_URI}" alt=""></div><div class="side front ${e.rev?'rev':''}">${faceSVG(e.card)}</div></div>`;
  d.onclick=()=>{
    if(d.classList.contains("flipped")||st.picked.length<SPREADS[st.spread].count) return;
    d.classList.add("flipped","glow"); st.flipped++; updateHint();
    if(st.flipped===SPREADS[st.spread].count) setTimeout(renderReading,900);
  };
  slot.querySelector(".ph").replaceWith(d);
}

/* ===================== 解牌 ===================== */
function topicText(c,rev,topic){
  const lines=[];
  const wrap=(label,txt)=>rev
    ? `${label}：此牌正位時代表「${txt.replace(/。$/,"")}」。如今以逆位出現，這股能量可能受阻、延遲，或被過度使用，請留意自己是否正在抗拒它，或用錯了方式。`
    : `${label}：${txt}`;
  if(topic==="love"||topic==="general") lines.push(["感情",wrap("感情",c.love).replace(/^感情：/,"")]);
  if(topic==="work"||topic==="general") lines.push(["事業財運",wrap("事業財運",c.work).replace(/^事業財運：/,"")]);
  return lines;
}
function cardBlock(e,i,sp){
  const c=e.card, p=sp.pos[i];
  const meta=c.major?`大阿爾克那 ${ROMAN[c.num]}・對應 ${c.astro}`:`${c.suitObj.name}牌組（${c.suitObj.el}元素）・${RANKS[c.rank].n}：${RANKS[c.rank].mean}`;
  const tps=topicText(c,e.rev,st.topic).map(([h,t])=>`<div class="rsec"><h4>◈ ${h}</h4><p>${t}</p></div>`).join("");
  return `<div class="rblock">
    <div class="mini ${e.rev?'rev':''}">${faceSVG(c)}</div>
    <div>
      <div class="rpos">第 ${i+1} 張・${p.t}</div>
      <div class="rtitle">${c.name}<span class="tag ${e.rev?'rv':'up'}">${e.rev?'逆位':'正位'}</span><small>${c.en}</small></div>
      <p class="posdesc">${p.d}<br>${meta}</p>
      <div class="kws">${c.kw.split("、").map(k=>`<span class="kw">${k}</span>`).join("")}</div>
      <div class="rsec"><h4>◈ ${e.rev?'逆位':'正位'}牌義</h4><p>${e.rev?c.rv:c.up}</p></div>
      ${tps}
      <div class="advice">✦ 給你的建議：${c.adv}${e.rev?'（逆位時，先找出卡住的地方，再朝這個方向調整。）':''}</div>
      ${apiDetails(c,e.rev)}
    </div></div>`;
}
function synthesis(sp){
  const P=st.picked, N=P.length, out=[];
  const majors=P.filter(e=>e.card.major).length;
  const revs=P.filter(e=>e.rev).length;
  const suitCount={};P.forEach(e=>{if(!e.card.major)suitCount[e.card.suit]=(suitCount[e.card.suit]||0)+1;});
  const courts=P.filter(e=>!e.card.major&&e.card.rank>=10).length;

  if(N===1){
    const e=P[0];
    out.push(`你抽到的是「${e.card.name}」${e.rev?"逆位":"正位"}。${e.card.major?"這是一張大阿爾克那，表示這個提醒對你而言意義重大，值得認真放在心上。":`它屬於${e.card.suitObj.name}牌組，與「${e.card.suitObj.theme}」有關，也代表${RANKS[e.card.rank].mean}的階段。`}`);
    out.push(`今天就帶著這句話出發：<b>${e.card.adv}</b>`);
    return out;
  }
  if(majors/N>=0.5) out.push(`大阿爾克那佔了 ${majors} / ${N} 張，顯示這件事牽涉到人生的重要課題，背後有較大的命運力量在推動，不完全是你能單方面掌控的——但你如何回應，仍然決定了結果。`);
  else if(majors===0) out.push(`牌陣中全是小阿爾克那，代表這件事主要取決於日常的選擇與行動，主導權在你手上，只要調整做法，局勢就能改變。`);
  else out.push(`牌陣中有 ${majors} 張大阿爾克那，代表這件事有關鍵的轉折點，其餘則落在日常的行動與選擇中。`);

  const entries=Object.entries(suitCount).sort((a,b)=>b[1]-a[1]);
  if(entries.length&&entries[0][1]>=2&&(!entries[1]||entries[0][1]>entries[1][1])){
    out.push(SUITS.find(s=>s.id===entries[0][0]).synth);
  }
  if(N>=5){
    const missing=SUITS.filter(s=>!suitCount[s.id]).map(s=>`${s.name}（${s.theme.split("、")[0]}）`);
    if(missing.length>=1&&missing.length<=2) out.push(`牌陣中缺少 ${missing.join("、")} 的能量，這可能是你目前較忽略、需要補足的面向。`);
  }
  if(st.rev){
    if(revs===0) out.push(`沒有出現任何逆位牌，整體能量流動順暢，事情較容易按照預期發展。`);
    else if(revs/N>=0.5) out.push(`逆位牌有 ${revs} 張，比例偏高，代表能量有受阻、內化或延遲的傾向。建議放慢腳步，先處理內在的阻力或舊有的模式，而不是急著往前衝。`);
    else out.push(`共有 ${revs} 張逆位牌，提醒你在這些位置上有需要調整與留意的地方。`);
  }
  if(courts>=2) out.push(`出現了 ${courts} 張宮廷牌，代表這件事和周遭的人密切相關，可能有多方人物的影響；這些牌也可能反映你自己需要扮演的角色。`);
  const rc={};P.forEach(e=>{if(!e.card.major)rc[e.card.rank]=(rc[e.card.rank]||0)+1;});
  Object.entries(rc).filter(([,v])=>v>=2).forEach(([r,v])=>out.push(`出現 ${v} 張「${RANKS[r].n}」，數字能量被強調：${RANKS[r].mean}，這正是你目前所處的階段主題。`));

  if(st.spread==="choice"){
    const score=e=>(e.rev?-1:1)+(e.card.major?0.5:0);
    const A=score(P[1])+score(P[2])*1.5, B=score(P[3])+score(P[4])*1.5;
    const res=(e)=>`「${e.card.name}」${e.rev?"逆位":"正位"}`;
    let verdict = Math.abs(A-B)<0.6 ? "兩條路的能量相當接近，沒有絕對的好壞，關鍵在於你更願意承擔哪一種過程。"
      : (A>B?"從牌面能量來看，選擇 A 的發展相對順暢。":"從牌面能量來看，選擇 B 的發展相對順暢。");
    out.push(`比較兩條路：選擇 A 的結果是${res(P[2])}，選擇 B 的結果是${res(P[4])}。${verdict}最終仍請回到現況牌「${P[0].card.name}」的提醒，誠實面對自己真正想要的。`);
  }
  if(st.spread==="love"){
    out.push(`你的心態是「${P[0].card.name}」，對方的心態是「${P[1].card.name}」。${P[0].rev===P[1].rev?"兩張牌方向一致，代表你們目前的狀態相當同步。":"兩張牌一正一逆，代表雙方目前的步調或期待不太一致，需要更多溝通。"}`);
  }
  const last=P[N-1];
  out.push(`整體的關鍵落在最後一張「${last.card.name}」${last.rev?"逆位":"正位"}。牌給你的最後一句話是：<b>${last.card.adv}</b>`);
  return out;
}
function renderReading(){
  const sp=SPREADS[st.spread];
  const syn=synthesis(sp);
  $("#reading").innerHTML=`<div class="panel">
      <h2>✦ 解牌｜${sp.name}（${TOPIC_LABEL[st.topic]}）</h2>
      ${st.picked.map((e,i)=>cardBlock(e,i,sp)).join("")}
      <div class="synth"><h3>✧ 綜合解讀</h3>
        ${st.q?`<div class="q">你的問題：${st.q.replace(/[<>&]/g,"")}</div>`:""}
        ${syn.map(t=>`<p>${t}</p>`).join("")}
      </div>
      <div class="actions">
        <button class="btn" id="copyBtn">複製解牌內容</button>
        <button class="btn primary" id="againBtn">重新占卜</button>
      </div></div>`;
  $("#copyBtn").onclick=()=>copyText(plainReading(sp,syn));
  $("#againBtn").onclick=()=>{$("#drawStage").classList.add("hidden");$("#reading").innerHTML="";$("#setup").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"});};
  updateHint();
  setTimeout(()=>$("#reading").scrollIntoView({behavior:"smooth",block:"start"}),100);
}
function plainReading(sp,syn){
  let t=`【星語塔羅｜${sp.name}】\n`; if(st.q) t+=`問題：${st.q}\n`; t+="\n";
  st.picked.forEach((e,i)=>{
    const c=e.card;
    t+=`${i+1}. ${sp.pos[i].t}：${c.name}（${e.rev?"逆位":"正位"}）\n${e.rev?c.rv:c.up}\n`;
    topicText(c,e.rev,st.topic).forEach(([h,x])=>t+=`・${h}：${x}\n`);
    t+=`・建議：${c.adv}\n\n`;
  });
  t+="【綜合解讀】\n"+syn.map(s=>s.replace(/<[^>]+>/g,"")).join("\n");
  return t;
}
function copyText(t){
  const done=()=>toast("已複製到剪貼簿 ✦");
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done();}catch(e){toast("複製失敗，請手動選取文字");}ta.remove();};
  try{navigator.clipboard.writeText(t).then(done,fallback);}catch(e){fallback();}
}
function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1800);}

/* ===================== 牌義圖鑑 ===================== */
const FILTERS=[["all","全部 78 張"],["major","大阿爾克那"],...SUITS.map(s=>[s.id,`${s.name}（${s.el}）`])];
let curFilter="all";
function renderLib(){
  $("#filters").innerHTML=FILTERS.map(([k,n])=>`<button class="chip-btn ${k===curFilter?'on':''}" data-f="${k}">${n}</button>`).join("");
  document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{curFilter=b.dataset.f;renderLib();});
  const list=DECK.filter(c=>curFilter==="all"||(curFilter==="major"?c.major:c.suit===curFilter));
  $("#grid").innerHTML=list.map(c=>`<div class="gcard" data-id="${c.id}">${faceSVG(c)}<div>${c.kw.split("、")[0]}</div></div>`).join("");
  document.querySelectorAll(".gcard").forEach(g=>g.onclick=()=>openCard(DECK.find(c=>c.id===g.dataset.id)));
}
function openCard(c){
  const meta=c.major?`大阿爾克那 ${ROMAN[c.num]}・對應星象：${c.astro}`
    :`${c.suitObj.name}牌組・${c.suitObj.el}元素：${c.suitObj.theme}<br>數字「${RANKS[c.rank].n}」：${RANKS[c.rank].mean}`;
  $("#mcontent").innerHTML=`<div class="mgrid"><div>${faceSVG(c)}</div><div>
    <div class="rtitle">${c.name}<small>${c.en}</small></div>
    <p class="posdesc">${meta}</p>
    <div class="kws">${c.kw.split("、").map(k=>`<span class="kw">${k}</span>`).join("")}</div>
    <div class="rsec"><h4>◈ 正位牌義</h4><p>${c.up}</p></div>
    <div class="rsec"><h4>◈ 逆位牌義</h4><p>${c.rv}</p></div>
    <div class="rsec"><h4>◈ 感情</h4><p>${c.love}</p></div>
    <div class="rsec"><h4>◈ 事業財運</h4><p>${c.work}</p></div>
    <div class="advice">✦ 建議：${c.adv}</div>${apiDetails(c)}</div></div>`;
  $("#modal").classList.add("show");
}
$("#mclose").onclick=()=>$("#modal").classList.remove("show");
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("show");};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").classList.remove("show");});

/* tabs */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("#tab-read").classList.toggle("hidden",b.dataset.tab!=="read");
  $("#tab-lib").classList.toggle("hidden",b.dataset.tab!=="lib");
  if(b.dataset.tab==="lib"&&!$("#grid").children.length) renderLib();
});
</script>
