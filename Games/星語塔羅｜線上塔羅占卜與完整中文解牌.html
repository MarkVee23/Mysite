<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星語塔羅｜線上塔羅占卜與完整中文解牌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a1d; --ink:#efe6d2; --muted:#a49fbf; --gold:#d8b66a; --gold2:#f1d99a;
  --panel:rgba(255,255,255,.045); --line:rgba(216,182,106,.28);
  --cw:108px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Noto Serif TC",serif; color:var(--ink); min-height:100vh; line-height:1.75;
  background:
    radial-gradient(1.2px 1.2px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 72% 12%,#fff7 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 40% 70%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 88% 60%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 25% 88%,#fff5 50%,transparent 51%),
    radial-gradient(1.3px 1.3px at 60% 40%,#fff5 50%,transparent 51%),
    radial-gradient(900px 600px at 50% -10%,#2e2366 0%,transparent 70%),
    radial-gradient(700px 500px at 100% 100%,#3a1d4f 0%,transparent 70%),
    var(--bg);
  background-attachment:fixed;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;margin-bottom:18px}
.brand{font-family:Cinzel,serif;letter-spacing:.32em;color:var(--gold);font-size:13px}
h1{margin:6px 0 4px;font-size:clamp(28px,5vw,42px);font-weight:700;letter-spacing:.12em;
  background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:14px;margin:0}
nav.tabs{display:flex;justify-content:center;gap:8px;margin:20px 0 26px}
nav.tabs button,.btn,.chip-btn{
  font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:9px 20px;border-radius:999px;font-size:15px;transition:.2s}
nav.tabs button.on{background:linear-gradient(180deg,#e6c87e,#b8944a);color:#1a1530;border-color:transparent;font-weight:700}
.btn:hover,nav.tabs button:hover,.chip-btn:hover{border-color:var(--gold)}
.btn.primary{background:linear-gradient(180deg,#e6c87e,#b8944a);color:#1a1530;border:none;font-weight:700;padding:12px 30px;font-size:16px;box-shadow:0 6px 24px #d8b66a33}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(4px)}
.panel h2{margin:0 0 14px;font-size:18px;color:var(--gold2);letter-spacing:.08em}
label.lbl{display:block;font-size:14px;color:var(--muted);margin:16px 0 8px}
textarea,select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:#0008;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
textarea:focus,select:focus{border-color:var(--gold)}
textarea{min-height:70px;resize:vertical}
.spreads{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.sp{border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:#0004;transition:.2s}
.sp:hover{border-color:var(--gold)}
.sp.on{border-color:var(--gold);background:linear-gradient(180deg,#d8b66a22,#d8b66a08);box-shadow:inset 0 0 0 1px var(--gold)}
.sp b{display:block;font-size:15px}
.sp span{font-size:12.5px;color:var(--muted)}
.sp em{font-style:normal;font-family:Cinzel,serif;color:var(--gold);font-size:12px;float:right}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--gold);width:17px;height:17px}
.center{text-align:center}
.hint{color:var(--muted);font-size:14px;margin:6px 0 14px;text-align:center}
.hint b{color:var(--gold2)}
/* fan */
.fan-wrap{overflow-x:auto;overflow-y:visible;padding:26px 10px 18px;margin:0 -6px;scrollbar-width:thin}
.fan{display:flex;min-width:max-content;padding:0 30px}
.fcard{width:58px;aspect-ratio:100/160;margin-left:-40px;cursor:pointer;transition:transform .2s,opacity .3s;border-radius:6px;flex:none;filter:drop-shadow(0 4px 6px #0008)}
.fcard:first-child{margin-left:0}
.fcard img{width:100%;height:100%;display:block}
.fcard:hover{transform:translateY(-16px)}
.fcard.taken{opacity:0;pointer-events:none;transform:translateY(-40px)}
.fan.shuffling .fcard{animation:shuf .5s ease-in-out infinite alternate}
@keyframes shuf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--dr))}}
/* cards */
.tcard{width:var(--cw);aspect-ratio:100/160;perspective:900px;cursor:pointer;position:relative}
.tcard .inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.tcard.flipped .inner{transform:rotateY(180deg)}
.tcard .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 6px 14px #000a)}
.tcard .side img,.tcard .side svg{width:100%;height:100%;display:block}
.tcard .front{transform:rotateY(180deg)}
.tcard .front.rev svg{transform:rotate(180deg)}
.tcard.deal{animation:deal .45s ease-out}
@keyframes deal{from{transform:translateY(-60px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.tcard.flipped.glow .side.front{filter:drop-shadow(0 0 14px #d8b66a66)}
/* spread layouts */
.area{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;padding:10px 0 6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.slot .ph{width:var(--cw);aspect-ratio:100/160;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--gold);font-family:Cinzel,serif;font-size:22px;opacity:.7}
.slot .cap{font-size:12.5px;color:var(--muted);text-align:center;max-width:calc(var(--cw) + 30px);line-height:1.35}
.slot .cap b{color:var(--gold2);font-family:Cinzel,serif;margin-right:3px}
.area.celtic{--cw:80px;gap:28px;align-items:center;flex-wrap:nowrap}
.cross{display:grid;grid-template-columns:repeat(3,auto);grid-template-rows:repeat(3,auto);gap:10px 12px;align-items:center;justify-items:center}
.staff{display:flex;flex-direction:column-reverse;gap:10px}
.staff .slot{flex-direction:row;gap:8px}
.staff .slot .cap{text-align:left;width:76px}
.cross .s0{grid-area:2/2}
.cross .s1{grid-area:2/2;z-index:3;margin-top:-18px}
.cross .s1 .tcard,.cross .s1 .ph{transform:rotate(90deg)}
.cross .s1 .cap{display:none}
.cross .s2{grid-area:3/2}.cross .s3{grid-area:2/1}.cross .s4{grid-area:1/2}.cross .s5{grid-area:2/3}
.area.choice{display:grid;grid-template-columns:repeat(2,auto);justify-content:center;gap:16px 60px}
.area.choice .s0{grid-column:1/3;justify-self:center}
.choice-col{display:flex;gap:14px;justify-content:center}
.choice-head{grid-row:2;text-align:center;font-size:14px;color:var(--gold2);letter-spacing:.1em}
/* reading */
#reading{margin-top:30px}
.rblock{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:20px 0;border-top:1px solid var(--line)}
.rblock:first-of-type{border-top:none}
.rblock .mini{width:120px}
.rblock .mini svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 12px #0009)}
.rblock .mini.rev svg{transform:rotate(180deg)}
.rpos{font-size:13px;color:var(--gold);font-family:Cinzel,"Noto Serif TC",serif;letter-spacing:.06em}
.rtitle{font-size:21px;font-weight:700;margin:2px 0 4px}
.rtitle small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:999px;margin-left:6px;vertical-align:middle;font-weight:400}
.tag.up{background:#5fbf8f22;color:#8fe0b5;border:1px solid #5fbf8f55}
.tag.rv{background:#d4626222;color:#f1a0a0;border:1px solid #d4626255}
.posdesc{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.kws{margin:6px 0 10px}
.kw{display:inline-block;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin:0 6px 6px 0;color:var(--gold2)}
.rsec{margin:8px 0}
.rsec h4{margin:0;font-size:13.5px;color:var(--gold);font-weight:600;letter-spacing:.05em}
.rsec p{margin:2px 0 0;font-size:15px}
.advice{background:linear-gradient(90deg,#d8b66a1f,transparent);border-left:3px solid var(--gold);padding:8px 14px;border-radius:0 10px 10px 0;margin-top:10px;font-size:15px}
.synth{margin-top:24px;background:linear-gradient(180deg,#2a2160aa,#1a1438aa);border:1px solid var(--gold);border-radius:18px;padding:22px 24px}
.synth h3{margin:0 0 10px;color:var(--gold2);font-size:19px;letter-spacing:.1em}
.synth p{margin:8px 0;font-size:15px}
.synth .q{color:var(--muted);font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:12px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:#1a1530;border:1px solid var(--gold);color:var(--gold2);padding:10px 22px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
/* gallery */
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.chip-btn{padding:6px 16px;font-size:14px}
.chip-btn.on{border-color:var(--gold);color:var(--gold2);background:#d8b66a1a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px}
.gcard{cursor:pointer;transition:transform .2s}
.gcard:hover{transform:translateY(-5px)}
.gcard svg{width:100%;height:auto;display:block;filter:drop-shadow(0 5px 10px #0009)}
.gcard div{text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.modal{position:fixed;inset:0;background:#05040ccc;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.mbox{background:#15122c;border:1px solid var(--gold);border-radius:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative}
.mbox .x{position:absolute;right:14px;top:10px;background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer}
.mgrid{display:grid;grid-template-columns:150px 1fr;gap:22px}
.mgrid svg{width:100%;height:auto}
details.api{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:#0003}
details.api summary{cursor:pointer;color:var(--gold);font-size:13.5px}
details.api p{font-size:13.5px;color:#d9d2bf;margin:6px 0;font-family:Georgia,"Noto Serif TC",serif;line-height:1.6}
details.api p b{color:var(--gold2);font-family:"Noto Serif TC",serif}
.src{display:inline-block;font-size:12px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-top:8px}
.src.live{color:#8fe0b5;border-color:#5fbf8f66}
.src i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:40px;opacity:.8}
.hidden{display:none!important}
@media (max-width:720px){
  :root{--cw:80px}
  .area{gap:12px}
  .area.celtic{--cw:50px;gap:12px}
  .staff .slot .cap{width:58px;font-size:11px}
  .cross{gap:6px}
  .cross .s1{margin-top:-10px}
  .area.choice{gap:12px 18px}
  .choice-col{gap:8px}
  .rblock{grid-template-columns:76px 1fr;gap:14px}
  .rblock .mini{width:76px}
  .mgrid{grid-template-columns:1fr}
  .mgrid > div:first-child{max-width:140px;margin:0 auto}
  .slot .cap{font-size:11.5px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26205a"/><stop offset="1" stop-color="#130f2e"/>
    </linearGradient>
    <radialGradient id="gHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f1d99a" stop-opacity=".28"/><stop offset="1" stop-color="#f1d99a" stop-opacity="0"/>
    </radialGradient>
    <symbol id="s-wands" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 18.5 L14 1.5"/><path d="M8.6 13.2 q-3.2 -.8 -3.8 -3.6 q3.2 .4 3.8 3.6z M11.2 7.8 q3.2 -.2 4.2 2.4 q-3.2 .6 -4.2 -2.4z" fill="currentColor" fill-opacity=".45"/></g></symbol>
    <symbol id="s-cups" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5 h12 c0 5.2 -2.6 8.4 -6 8.4 c-3.4 0 -6 -3.2 -6 -8.4z" fill="currentColor" fill-opacity=".25"/><path d="M10 11 v5.2 M6.4 18 h7.2"/></g></symbol>
    <symbol id="s-swords" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1 l1.7 3 v9 h-3.4 v-9z" fill="currentColor" fill-opacity=".25"/><path d="M5.2 13 h9.6 M10 13 v6"/></g></symbol>
    <symbol id="s-pentacles" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-linejoin="round"><circle cx="10" cy="10" r="8.3" stroke-width="1.4" fill="currentColor" fill-opacity=".12"/><path d="M10 3.4 L13.9 15.3 L3.7 8 H16.3 L6.1 15.3Z" stroke-width="1"/></g></symbol>
  </defs>
</svg>

<div class="wrap">
  <header>
    <div class="brand">✦ ARCANA · STELLA ✦</div>
    <h1>星語塔羅</h1>
    <p class="sub">靜心默念你的問題，讓 78 張牌為你映照內心的答案</p>
  </header>

  <nav class="tabs">
    <button class="on" data-tab="read">開始占卜</button>
    <button data-tab="lib">牌義圖鑑</button>
  </nav>

  <!-- ========== READ ========== -->
  <section id="tab-read">
    <div id="setup" class="panel">
      <h2>一、寫下你的問題</h2>
      <textarea id="q" placeholder="例如：我接下來三個月的事業發展會如何？／我和他之間的關係會走向哪裡？（可留白，牌會給你當下最需要的訊息）"></textarea>
      <div class="row" style="margin-top:4px">
        <div style="flex:1;min-width:200px">
          <label class="lbl">問題類型（影響解牌重點）</label>
          <select id="topic">
            <option value="general">綜合運勢／自我探索</option>
            <option value="love">感情／人際關係</option>
            <option value="work">事業／學業／財運</option>
          </select>
        </div>
        <div style="padding-top:40px">
          <label class="toggle"><input type="checkbox" id="rev" checked> 啟用逆位牌</label>
        </div>
      </div>
      <h2 style="margin-top:26px">二、選擇牌陣</h2>
      <div class="spreads" id="spreads"></div>
      <div class="center" style="margin-top:24px">
        <button class="btn primary" id="startBtn">✦ 呼叫 Tarot API 洗牌並開始抽牌</button><br>
        <span class="src" id="srcBadge"><i></i>資料來源：Tarot API（tarotapi.dev）</span>
      </div>
    </div>

    <div id="drawStage" class="hidden">
      <div class="panel">
        <p class="hint" id="drawHint"></p>
        <div class="fan-wrap"><div class="fan" id="fan"></div></div>
        <div class="center" style="margin-top:6px">
          <button class="btn ghost" id="autoBtn">讓命運替我抽</button>
          <button class="btn" id="flipAllBtn" style="display:none">全部翻開</button>
        </div>
      </div>
      <div class="panel" style="margin-top:18px">
        <div class="area" id="area"></div>
      </div>
    </div>

    <div id="reading"></div>
  </section>

  <!-- ========== LIBRARY ========== -->
  <section id="tab-lib" class="hidden">
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>牌卡英文原典資料來自 <a href="https://tarotapi.dev" style="color:var(--gold)">Tarot API（tarotapi.dev）</a>，取材自 A.E. Waite《The Pictorial Key to the Tarot》（1910）。<br>塔羅占卜僅供娛樂與自我反思之用，重要決定請綜合現實狀況與專業意見。</footer>
</div>

<div class="modal" id="modal"><div class="mbox"><button class="x" id="mclose">×</button><div id="mcontent"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 牌義資料 ===================== */
// [中文名, 英文名, 星象符號, 對應, 關鍵字, 正位, 逆位, 感情, 事業財運, 建議]
const MAJOR = [
["愚者","The Fool","♅","天王星・風元素","新的開始、自由、冒險、純真",
 "你正站在一段新旅程的起點，帶著純真與好奇準備躍入未知。愚者鼓勵你相信直覺、放下過多的顧慮，用開放的心擁抱各種可能。前方雖然看不清楚，但當你踏出第一步，路自然會在腳下展開。",
 "魯莽衝動、不顧後果，或是因為恐懼而遲遲不敢開始。也可能代表缺乏計畫、過於天真而忽略了明顯的風險。請誠實檢視：你是在勇敢冒險，還是在逃避該負的責任？",
 "輕鬆自在、充滿新鮮感的戀情；單身者可能遇到意想不到的緣分。不需要急著定義關係，享受相處的當下。",
 "轉職、創業或嘗試全新領域的好時機。財務上可能有一筆新的開始，但記得做好基本的功課與預算。",
 "勇敢跳躍，但記得先看一眼腳下的路。"],
["魔術師","The Magician","☿","水星","意志、創造、行動力、資源具足",
 "你已經擁有實現目標所需要的一切資源與能力。魔術師象徵把想法化為現實的力量，此刻是主動出擊、展現才華的最佳時機。只要專注你的意念並付諸行動，事情就會照著你的意志成形。",
 "才能沒有被好好發揮、缺乏方向，或是有操弄、欺騙的意圖存在。也可能是自信不足，計畫一直停留在空談階段。同時要小心身邊花言巧語、言過其實的人。",
 "你的魅力十足，主動表達心意會有好結果。逆位時需留意對方的話語是否真誠，別被甜言蜜語迷惑。",
 "提案、簽約、談判、展現專業的絕佳時機，溝通與技術能力就是你的武器；適合開創副業或新收入來源。",
 "你已經準備好了，現在就開始。"],
["女祭司","The High Priestess","☽","月亮","直覺、潛意識、靜默、神秘、內在智慧",
 "答案不在外面，而在你的內心深處。女祭司提醒你暫緩行動，靜下心來傾聽直覺、夢境與身體傳來的訊息。有些事情尚未揭曉，時機未到時，耐心等待真相自然浮現就是最好的策略。",
 "忽視自己的直覺、過度依賴他人意見，或是有秘密、隱情被壓抑在檯面下。也可能與內在失去連結，感到空虛迷惘；或是表面平靜、內心卻充滿未說出口的情緒。",
 "關係中有尚未說出口的感受，或是一段柏拉圖式、精神層面的連結。曖昧期需要時間觀察，不宜急著攤牌。",

const API_SNAPSHOT=[{"type": "major", "name_short": "ar01", "name": "The Magician", "value": "1", "meaning_up": "Skill, diplomacy, address, subtlety; sickness, pain, loss, disaster, snares of enemies; self-confidence, will; the Querent, if male.", "meaning_rev": "Physician, Magus, mental disease, disgrace, disquiet.", "desc": "A youthful figure in the robe of a magician, having the countenance of divine Apollo, with smile of confidence and shining eyes. Above his head is the mysterious sign of the Holy Spirit, the sign of life, like an endless cord, forming the figure 8 in a horizontal position . About his waist is a serpent-cincture, the serpent appearing to devour its own tail. This is familiar to most as a conventional symbol of eternity, but here it indicates more especially the eternity of attainment in the spirit. In the Magician's right hand is a wand raised towards heaven, while the left hand is pointing to the earth. This dual sign is known in very high grades of the Instituted Mysteries; it shews the descent of grace, virtue and light, drawn from things above and derived to things below. The suggestion throughout is therefore the possession and communication of the Powers and Gifts of the Spirit. On the table in front of the Magician are the symbols of the four Tarot suits, signifying the elements of natural life, which lie like counters before the adept, and he adapts them as he wills. Beneath are roses and lilies, the flos campi and lilium convallium, changed into garden flowers, to shew the culture of aspiration. This card signifies the divine motive in man, reflecting God, the will in the liberation of its union with that which is above. It is also the unity of individual being on all planes, and in a very high sense it is thought, in the fixation thereof. With further reference to what I have called the sign of life and its connexion with the number 8, it may be remembered that Christian Gnosticism speaks of rebirth in Christ as a change \"unto the Ogdoad.\" The mystic number is termed Jerusalem above, the Land flowing with Milk and Honey, the Holy Spirit and the Land of the Lord. According to Martinism, 8 is the number of Christ."}, {"type": "major", "name_short": "ar02", "name": "The High Priestess", "value": "2", "meaning_up": "Secrets, mystery, the future as yet unrevealed; the woman who interests the Querent, if male; the Querent herself, if female; silence, tenacity; mystery, wisdom, science.", "meaning_rev": "Passion, moral or physical ardour, conceit, surface knowledge.", "desc": "She has the lunar crescent at her feet, a horned diadem on her head, with a globe in the middle place, and a large solar cross on her breast. The scroll in her hands is inscribed with the word Tora, signifying the Greater Law, the Secret Law and the second sense of the Word. It is partly covered by her mantle, to shew that some things are implied and some spoken. She is seated between the white and black pillars--J. and B.--of the mystic Temple, and the veil of the Temple is behind her: it is embroidered with palms and pomegranates. The vestments are flowing and gauzy, and the mantle suggests light--a shimmering radiance. She has been called occult Science on the threshold of the Sanctuary of Isis, but she is really the Secret Church, the House which is of God and man. She represents also the Second Marriage of the Prince who is no longer of this world; she is the spiritual Bride and Mother, the daughter of the stars and the Higher Garden of Eden. She is, in fine, the Queen of the borrowed light, but this is the light of all. She is the Moon nourished by the milk of the Supernal Mother.\nIn a manner, she is also the Supernal Mother herself--that is to say, she is the bright reflection. It is in this sense of reflection that her truest and highest name in bolism is Shekinah--the co-habiting glory. According to Kabalism, there is a Shekinah both above and below. In the superior world it is called Binah, the Supernal Understanding which reflects to the emanations that are beneath. In the lower world it is MaIkuth--that world being, for this purpose, understood as a blessed Kingdom that with which it is made blessed being the Indwelling Glory. Mystically speaking, the Shekinah is the Spiritual Bride of the just man, and when he reads the Law she gives the Divine meaning. There are some respects in which this card is the highest and holiest of the Greater Arcana."}, {"type": "major", "name_short": "ar03", "name": "The Empress", "value": "3", "meaning_up": "Fruitfulness, action, initiative, length of days; the unknown, clandestine; also difficulty, doubt, ignorance.", "meaning_rev": "Light, truth, the unravelling of involved matters, public rejoicings; according to another reading, vacillation.", "desc": "A stately figure, seated, having rich vestments and royal aspect, as of a daughter of heaven and earth. Her diadem is of twelve stars, gathered in a cluster. The symbol of Venus is on the shield which rests near her. A field of corn is ripening in front of her, and beyond there is a fall of water. The sceptre which she bears is surmounted by the globe of this world. She is the inferior Garden of Eden, the Earthly Paradise, all that is symbolized by the visible house of man. She is not Regina coeli, but she is still refugium peccatorum, the fruitful mother of thousands. There are also certain aspects in which she has been correctly described as desire and the wings thereof, as the woman clothed with the sun, as Gloria Mundi and the veil of the Sanctum Sanctorum; but she is not, I may add, the soul that has attained wings, unless all the symbolism is counted up another and unusual way. She is above all things universal fecundity and the outer sense of the Word. This is obvious, because there is no direct message which has been given to man like that which is borne by woman; but she does not herself carry its interpretation.\nIn another order of ideas, the card of the Empress signifies the door or gate by which an entrance is obtained into this life, as into the Garden of Venus; and then the way which leads out therefrom, into that which is beyond, is the secret known to the High Priestess: it is communicated by her to the elect. Most old attributions of this card are completely wrong on the symbolism--as, for example, its identification with the Word, Divine Nature, the Triad, and so forth."}, {"type": "major", "name_short": "ar04", "name": "The Emperor", "value": "4", "meaning_up": "Stability, power, protection, realization; a great person; aid, reason, conviction; also authority and will.", "meaning_rev": "Benevolence, compassion, credit; also confusion to enemies, obstruction, immaturity.", "desc": "He has a form of the Crux ansata for his sceptre and a globe in his left hand. He is a crowned monarch--commanding, stately, seated on a throne, the arms of which axe fronted by rams' heads. He is executive and realization, the power of this world, here clothed with the highest of its natural attributes. He is occasionally represented as seated on a cubic stone, which, however, confuses some of the issues. He is the virile power, to which the Empress responds, and in this sense is he who seeks to remove the Veil of Isis; yet she remains virgo intacta.\nIt should be understood that this card and that of the Empress do not precisely represent the condition of married life, though this state is implied. On the surface, as I have indicated, they stand for mundane royalty, uplifted on the seats of the mighty; but above this there is the suggestion of another presence. They signify also--and the male figure especially--the higher kingship, occupying the intellectual throne. Hereof is the lordship of thought rather than of the animal world. Both personalities, after their own manner, are \"full of strange experience,\" but theirs is not consciously the wisdom which draws from a higher world. The Emperor has been described as (a) will in its embodied form, but this is only one of its applications, and (b) as an expression of virtualities contained in the Absolute Being--but this is fantasy."}, {"type": "major", "name_short": "ar05", "name": "The Hierophant", "value": "5", "meaning_up": "Marriage, alliance, captivity, servitude; by another account, mercy and goodness; inspiration; the man to whom the Querent has recourse.", "meaning_rev": "Society, good understanding, concord, overkindness, weakness.", "desc": "He wears the triple crown and is seated between two pillars, but they are not those of the Temple which is guarded by the High Priestess. In his left hand he holds a sceptre terminating in the triple cross, and with his right hand he gives the well-known ecclesiastical sign which is called that of esotericism, distinguishing between the manifest and concealed part of doctrine. It is noticeable in this connexion that the High Priestess makes no sign. At his feet are the crossed keys, and two priestly ministers in albs kneel before him. He has been usually called the Pope, which is a particular application of the more general office that he symbolizes. He is the ruling power of external religion, as the High Priestess is the prevailing genius of the esoteric, withdrawn power. The proper meanings of this card have suffered woeful admixture from nearly all hands. Grand Orient says truly that the Hierophant is the power of the keys, exoteric orthodox doctrine, and the outer side of the life which leads to the doctrine; but he is certainly not the prince of occult doctrine, as another commentator has suggested.\nHe is rather the summa totius theologiæ, when it has passed into the utmost rigidity of expression; but he symbolizes also all things that are righteous and sacred on the manifest side. As such, he is the channel of grace belonging to the world of institution as distinct from that of Nature, and he is the leader of salvation for the human race at large. He is the order and the head of the recognized hierarchy, which is the reflection of another and greater hierarchic order; but it may so happen that the pontiff forgets the significance of this his symbolic state and acts as if he contained within his proper measures all that his sign signifies or his symbol seeks to shew forth. He is not, as it has been thought, philosophy-except on the theological side; he is not inspiration; and he is not religion, although he is a mode of its expression."}, {"type": "major", "name_short": "ar06", "name": "The Lovers", "value": "6", "meaning_up": "Attraction, love, beauty, trials overcome.", "meaning_rev": "Failure, foolish designs. Another account speaks of marriage frustrated and contrarieties of all kinds.", "desc": "The sun shines in the zenith, and beneath is a great winged figure with arms extended, pouring down influences. In the foreground are two human figures, male and female, unveiled before each other, as if Adam and Eve when they first occupied the paradise of the earthly body. Behind the man is the Tree of Life, bearing twelve fruits, and the Tree of the Knowledge of Good and Evil is behind the woman; the serpent is twining round it. The figures suggest youth, virginity, innocence and love before it is contaminated by gross material desire. This is in all simplicity the card of human love, here exhibited as part of the way, the truth and the life. It replaces, by recourse to first principles, the old card of marriage, which I have described previously, and the later follies which depicted man between vice and virtue. In a very high sense, the card is a mystery of the Covenant and Sabbath.\nThe suggestion in respect of the woman is that she signifies that attraction towards the sensitive life which carries within it the idea of the Fall of Man, but she is rather the working of a Secret Law of Providence than a willing and conscious temptress. It is through her imputed lapse that man shall arise ultimately, and only by her can he complete himself. The card is therefore in its way another intimation concerning the great mystery of womanhood. The old meanings fall to pieces of necessity with the old pictures, but even as interpretations of the latter, some of them were of the order of commonplace and others were false in symbolism."}, {"type": "major", "name_short": "ar07", "name": "The Chariot", "value": "7", "meaning_up": "Succour, providence also war, triumph, presumption, vengeance, trouble.", "meaning_rev": "Riot, quarrel, dispute, litigation, defeat.", "desc": "An erect and princely figure carrying a drawn sword and corresponding, broadly speaking, to the traditional description which I have given in the first part. On the shoulders of the victorious hero are supposed to be the Urim and Thummim. He has led captivity captive; he is conquest on all planes--in the mind, in science, in progress, in certain trials of initiation. He has thus replied to the sphinx, and it is on this account that I have accepted the variation of Éliphas Lévi; two sphinxes thus draw his chariot. He is above all things triumph in the mind.\nIt is to be understood for this reason (a) that the question of the sphinx is concerned with a Mystery of Nature and not of the world of Grace, to which the charioteer could offer no answer; (b) that the planes of his conquest are manifest or external and not within himself; (c) that the liberation which he effects may leave himself in the bondage of the logical understanding; (d) that the tests of initiation through which he has passed in triumph are to be understood physically or rationally; and (e) that if he came to the pillars of that Temple between which the High Priestess is seated, he could not open the scroll called Tora, nor if she questioned him could he answer. He is not hereditary royalty and he is not priesthood."}, {"type": "major", "name_short": "ar08", "name": "Fortitude", "value": "8", "meaning_up": "Power, energy, action, courage, magnanimity; also complete success and honours.", "meaning_rev": "Despotism, abuse if power, weakness, discord, sometimes even disgrace.", "desc": "A woman, over whose head there broods the same symbol of life which we have seen in the card of the Magician, is closing the jaws of a lion. The only point in which this design differs from the conventional presentations is that her beneficent fortitude has already subdued the lion, which is being led by a chain of flowers. For reasons which satisfy myself, this card has been interchanged with that of justice, which is usually numbered eight. As the variation carries nothing with it which will signify to the reader, there is no cause for explanation. Fortitude, in one of its most exalted aspects, is connected with the Divine Mystery of Union; the virtue, of course, operates in all planes, and hence draws on all in its symbolism. It connects also with innocentia inviolata, and with the strength which resides in contemplation.\nThese higher meanings are, however, matters of inference, and I do not suggest that they are transparent on the surface of the card. They are intimated in a concealed manner by the chain of flowers, which signifies, among many other things, the sweet yoke and the light burden of Divine Law, when it has been taken into the heart of hearts. The card has nothing to do with self-confidence in the ordinary sense, though this has been suggested--but it concerns the confidence of those whose strength is God, who have found their refuge in Him. There is one aspect in which the lion signifies the passions, and she who is called Strength is the higher nature in its liberation. It has walked upon the asp and the basilisk and has trodden down the lion and the dragon."}, {"type": "major", "name_short": "ar09", "name": "The Hermit", "value": "9", "meaning_up": "Prudence, circumspection; also and especially treason, dissimulation, roguery, corruption.", "meaning_rev": "Concealment, disguise, policy, fear, unreasoned caution.", "desc": "The variation from the conventional models in this card is only that the lamp is not enveloped partially in the mantle of its bearer, who blends the idea of the Ancient of Days with the Light of the World It is a star which shines in the lantern. I have said that this is a card of attainment, and to extend this conception the figure is seen holding up his beacon on an eminence. Therefore the Hermit is not, as Court de Gebelin explained, a wise man in search of truth and justice; nor is he, as a later explanation proposes, an especial example of experience. His beacon intimates that \"where I am, you also may be.\"\nIt is further a card which is understood quite incorrectly when it is connected with the idea of occult isolation, as the protection of personal magnetism against admixture. This is one of the frivolous renderings which we owe to Éliphas Lévi. It has been adopted by the French Order of Martinism and some of us have heard a great deal of the Silent and Unknown Philosophy enveloped by his mantle from the knowledge of the profane. In true Martinism, the significance of the term Philosophe inconnu was of another order. It did not refer to the intended concealment of the Instituted Mysteries, much less of their substitutes, but--like the card itself--to the truth that the Divine Mysteries secure their own protection from those who are unprepared."}, {"type": "major", "name_short": "ar10", "name": "Wheel Of Fortune", "value": "10", "meaning_up": "Destiny, fortune, success, elevation, luck, felicity.", "meaning_rev": "Increase, abundance, superfluity.", "desc": "In this symbol I have again followed the reconstruction of Éliphas Lévi, who has furnished several variants. It is legitimate--as I have intimated--to use Egyptian symbolism when this serves our purpose, provided that no theory of origin is implied therein. I have, however, presented Typhon in his serpent form. The symbolism is, of course, not exclusively Egyptian, as the four Living Creatures of Ezekiel occupy the angles of the card, and the wheel itself follows other indications of Lévi in respect of Ezekiel's vision, as illustrative of the particular Tarot Key. With the French occultist, and in the design itself, the symbolic picture stands for the perpetual motion of a fluidic universe and for the flux of human life. The Sphinx is the equilibrium therein. The transliteration of Taro as Rota is inscribed on the wheel, counterchanged with the letters of the Divine Name--to shew that Providence is imphed through all. But this is the Divine intention within, and the similar intention without is exemplified by the four Living Creatures. Sometimes the sphinx is represented couchant on a pedestal above, which defrauds the symbolism by stultifying the essential idea of stability amidst movement.\nBehind the general notion expressed in the symbol there lies the denial of chance and the fatality which is implied therein. It may be added that, from the days of Lévi onward, the occult explanations of this card are--even for occultism itself--of a singularly fatuous kind. It has been said to mean principle, fecundity, virile honour, ruling authority, etc. The findings of common fortune-telling are better than this on their own plane."}, {"type": "major", "name_short": "ar11", "name": "Justice", "value": "11", "meaning_up": "Equity, rightness, probity, executive; triumph of the deserving side in law.", "meaning_rev": "Law in all its departments, legal complications, bigotry, bias, excessive severity.", "desc": "As this card follows the traditional symbolism and carries above all its obvious meanings, there is little to say regarding it outside the few considerations collected in the first part, to which the reader is referred.\nIt will be seen, however, that the figure is seated between pillars, like the High Priestess, and on this account it seems desirable to indicate that the moral principle which deals unto every man according to his works--while, of course, it is in strict analogy with higher things;--differs in its essence from the spiritual justice which is involved in the idea of election. The latter belongs to a mysterious order of Providence, in virtue of which it is possible for certain men to conceive the idea of dedication to the highest things. The operation of this is like the breathing of the Spirit where it wills, and we have no canon of criticism or ground of explanation concerning it. It is analogous to the possession of the fairy gifts and the high gifts and the gracious gifts of the poet: we have them or have not, and their presence is as much a mystery as their absence. The law of Justice is not however involved by either alternative. In conclusion, the pillars of Justice open into one world and the pillars of the High Priestess into another."}, {"type": "major", "name_short": "ar12", "name": "The Hanged Man", "value": "12", "meaning_up": "Wisdom, circumspection, discernment, trials, sacrifice, intuition, divination, prophecy.", "meaning_rev": "Selfishness, the crowd, body politic.", "desc": "The gallows from which he is suspended forms a Tau cross, while the figure--from the position of the legs--forms a fylfot cross. There is a nimbus about the head of the seeming martyr. It should be noted (1) that the tree of sacrifice is living wood, with leaves thereon; (2) that the face expresses deep entrancement, not suffering; (3) that the figure, as a whole, suggests life in suspension, but life and not death. It is a card of profound significance, but all the significance is veiled. One of his editors suggests that Éliphas Lévi did not know the meaning, which is unquestionable nor did the editor himself. It has been called falsely a card of martyrdom, a card a of prudence, a card of the Great Work, a card of duty; but we may exhaust all published interpretations and find only vanity. I will say very simply on my own part that it expresses the relation, in one of its aspects, between the Divine and the Universe.\nHe who can understand that the story of his higher nature is imbedded in this symbolism will receive intimations concerning a great awakening that is possible, and will know that after the sacred Mystery of Death there is a glorious Mystery of Resurrection."}, {"type": "major", "name_short": "ar13", "name": "Death", "value": "13", "meaning_up": "End, mortality, destruction, corruption also, for a man, the loss of a benefactor for a woman, many contrarieties; for a maid, failure of marriage projects.", "meaning_rev": "Inertia, sleep, lethargy, petrifaction, somnambulism; hope destroyed.", "desc": "The veil or mask of life is perpetuated in change, transformation and passage from lower to higher, and this is more fitly represented in the rectified Tarot by one of the apocalyptic visions than by the crude notion of the reaping skeleton. Behind it lies the whole world of ascent in the spirit. The mysterious horseman moves slowly, bearing a black banner emblazoned with the Mystic Rose, which signifies life. Between two pillars on the verge of the horizon there shines the sun of immortality. The horseman carries no visible weapon, but king and child and maiden fall before him, while a prelate with clasped hands awaits his end.\nThere should be no need to point out that the suggestion of death which I have made in connection with the previous card is, of course, to be understood mystically, but this is not the case in the present instance. The natural transit of man to the next stage of his being either is or may be one form of his progress, but the exotic and almost unknown entrance, while still in this life, into the state of mystical death is a change in the form of consciousness and the passage into a state to which ordinary death is neither the path nor gate. The existing occult explanations of the 13th card are, on the whole, better than usual, rebirth, creation, destination, renewal, and the rest."}, {"type": "major", "name_short": "ar14", "name": "Temperance", "value": "14", "meaning_up": "Economy, moderation, frugality, management, accommodation.", "meaning_rev": "Things connected with churches, religions, sects, the priesthood, sometimes even the priest who will marry the Querent; also disunion, unfortunate combinations, competing interests.", "desc": "A winged angel, with the sign of the sun upon his forehead and on his breast the square and triangle of the septenary. I speak of him in the masculine sense, but the figure is neither male nor female. It is held to be pouring the essences of life from chalice to chalice. It has one foot upon the earth and one upon waters, thus illustrating the nature of the essences. A direct path goes up to certain heights on the verge of the horizon, and above there is a great light, through which a crown is seen vaguely. Hereof is some part of the Secret of Eternal Life, as it is possible to man in his incarnation. All the conventional emblems are renounced herein.\nSo also are the conventional meanings, which refer to changes in the seasons, perpetual movement of life and even the combination of ideas. It is, moreover, untrue to say that the figure symbolizes the genius of the sun, though it is the analogy of solar light, realized in the third part of our human triplicity. It is called Temperance fantastically, because, when the rule of it obtains in our consciousness, it tempers, combines and harmonises the psychic and material natures. Under that rule we know in our rational part something of whence we came and whither we are going."}, {"type": "major", "name_short": "ar15", "name": "The Devil", "value": "15", "meaning_up": "Ravage, violence, vehemence, extraordinary efforts, force, fatality; that which is predestined but is not for this reason evil.", "meaning_rev": "Evil fatality, weakness, pettiness, blindness.", "desc": "The design is an accommodation, mean or harmony, between several motives mentioned in the first part. The Horned Goat of Mendes, with wings like those of a bat, is standing on an altar. At the pit of the stomach there is the sign of Mercury. The right hand is upraised and extended, being the reverse of that benediction which is given by the Hierophant in the fifth card. In the left hand there is a great flaming torch, inverted towards the earth. A reversed pentagram is on the forehead. There is a ring in front of the altar, from which two chains are carried to the necks of two figures, male and female. These are analogous with those of the fifth card, as if Adam and Eve after the Fall. Hereof is the chain and fatality of the material life.\nThe figures are tailed, to signify the animal nature, but there is human intelligence in the faces, and he who is exalted above them is not to be their master for ever. Even now, he is also a bondsman, sustained by the evil that is in him and blind to the liberty of service. With more than his usual derision for the arts which he pretended to respect and interpret as a master therein, Éliphas Lévi affirms that the Baphometic figure is occult science and magic. Another commentator says that in the Divine world it signifies predestination, but there is no correspondence in that world with the things which below are of the brute. What it does signify is the Dweller on the Threshold without the Mystical Garden when those are driven forth therefrom who have eaten the forbidden fruit."}, {"type": "major", "name_short": "ar16", "name": "The Tower", "value": "16", "meaning_up": "Misery, distress, indigence, adversity, calamity, disgrace, deception, ruin. It is a card in particular of unforeseen catastrophe.", "meaning_rev": "According to one account, the same in a lesser degree also oppression, imprisonment, tyranny.", "desc": "Occult explanations attached to this card are meagre and mostly disconcerting. It is idle to indicate that it depicts min in all its aspects, because it bears this evidence on the surface. It is said further that it contains the first allusion to a material building, but I do not conceive that the Tower is more or less material than the pillars which we have met with in three previous cases. I see nothing to warrant Papus in supposing that it is literally the fall of Adam, but there is more in favour of his alternative--that it signifies the materialization of the spiritual word. The bibliographer Christian imagines that it is the downfall of the mind, seeking to penetrate the mystery of God. I agree rather with Grand Orient that it is the ruin of the House of We, when evil has prevailed therein, and above all that it is the rending of a House of Doctrine. I understand that the reference is, however, to a House of Falsehood. It illustrates also in the most comprehensive way the old truth that \"except the Lord build the house, they labour in vain that build it.\"\nThere is a sense in which the catastrophe is a reflection from the previous card, but not on the side of the symbolism which I have tried to indicate therein. It is more correctly a question of analogy; one is concerned with the fall into the material and animal state, while the other signifies destruction on the intellectual side. The Tower has been spoken of as the chastisement of pride and the intellect overwhelmed in the attempt to penetrate the Mystery of God; but in neither case do these explanations account for the two persons who are the living sufferers. The one is the literal word made void and the other its false interpretation. In yet a deeper sense, it may signify also the end of a dispensation, but there is no possibility here for the consideration of this involved question."}, {"type": "major", "name_short": "ar17", "name": "The Star", "value": "17", "meaning_up": "Loss, theft, privation, abandonment; another reading says-hope and bright prospects,", "meaning_rev": "Arrogance, haughtiness, impotence.", "desc": "A great, radiant star of eight rays, surrounded by seven lesser stars--also of eight rays. The female figure in the foreground is entirely naked. Her left knee is on the land and her right foot upon the water. She pours Water of Life from two great ewers, irrigating sea and land. Behind her is rising ground and on the right a shrub or tree, whereon a bird alights. The figure expresses eternal youth and beauty. The star is l'étoile flamboyante, which appears in Masonic symbolism, but has been confused therein. That which the figure communicates to the living scene is the substance of the heavens and the elements. It has been said truly that the mottoes of this card are \"Waters of Life freely\" and \"Gifts of the Spirit.\"\nThe summary of several tawdry explanations says that it is a card of hope. On other planes it has been certified as immortality and interior light. For the majority of prepared minds, the figure will appear as the type of Truth unveiled, glorious in undying beauty, pouring on the waters of the soul some part and measure of her priceless possession. But she is in reality the Great Mother in the Kabalistic Sephira Binah, which is supernal Understanding, who communicates to the Sephiroth that are below in the measure that they can receive her influx."}, {"type": "major", "name_short": "ar18", "name": "The Moon", "value": "18", "meaning_up": "Hidden enemies, danger, calumny, darkness, terror, deception, occult forces, error.", "meaning_rev": "Instability, inconstancy, silence, lesser degrees of deception and error.", "desc": "The distinction between this card and some of the conventional types is that the moon is increasing on what is called the side of mercy, to the right of the observer. It has sixteen chief and sixteen secondary rays. The card represents life of the imagination apart from life of the spirit. The path between the towers is the issue into the unknown. The dog and wolf are the fears of the natural mind in the presence of that place of exit, when there is only reflected light to guide it.\nThe last reference is a key to another form of symbolism. The intellectual light is a reflection and beyond it is the unknown mystery which it cannot shew forth. It illuminates our animal nature, types of which are represented below--the dog, the wolf and that which comes up out of the deeps, the nameless and hideous tendency which is lower than the savage beast. It strives to attain manifestation, symbolized by crawling from the abyss of water to the land, but as a rule it sinks back whence it came. The face of the mind directs a calm gaze upon the unrest below; the dew of thought falls; the message is: Peace, be still; and it may be that there shall come a calm upon the animal nature, while the abyss beneath shall cease from giving up a form."}, {"type": "major", "name_short": "ar19", "name": "The Sun", "value": "19", "meaning_up": "Material happiness, fortunate marriage, contentment.", "meaning_rev": "The same in a lesser sense.", "desc": "The naked child mounted on a white horse and displaying a red standard has been mentioned already as the better symbolism connected with this card. It is the destiny of the Supernatural East and the great and holy light which goes before the endless procession of humanity, coming out from the walled garden of the sensitive life and passing on the journey home. The card signifies, therefore, the transit from the manifest light of this world, represented by the glorious sun of earth, to the light of the world to come, which goes before aspiration and is typified by the heart of a child.\nBut the last allusion is again the key to a different form or aspect of the symbolism. The sun is that of consciousness in the spirit - the direct as the antithesis of the reflected light. The characteristic type of humanity has become a little child therein--a child in the sense of simplicity and innocence in the sense of wisdom. In that simplicity, he bears the seal of Nature and of Art; in that innocence, he signifies the restored world. When the self-knowing spirit has dawned in the consciousness above the natural mind, that mind in its renewal leads forth the animal nature in a state of perfect conformity."}, {"type": "major", "name_short": "ar20", "name": "The Last Judgment", "value": "20", "meaning_up": "Change of position, renewal, outcome. Another account specifies total loss though lawsuit.", "meaning_rev": "Weakness, pusillanimity, simplicity; also deliberation, decision, sentence.", "desc": "I have said that this symbol is essentially invariable in all Tarot sets, or at least the variations do not alter its character. The great angel is here encompassed by clouds, but he blows his bannered trumpet, and the cross as usual is displayed on the banner. The dead are rising from their tombs--a woman on the right, a man on the left hand, and between them their child, whose back is turned. But in this card there are more than three who are restored, and it has been thought worth while to make this variation as illustrating the insufficiency of current explanations. It should be noted that all the figures are as one in the wonder, adoration and ecstacy expressed by their attitudes. It is the card which registers the accomplishment of the great work of transformation in answer to the summons of the Supernal--which summons is heard and answered from within.\nHerein is the intimation of a significance which cannot well be carried further in the present place. What is that within us which does sound a trumpet and all that is lower in our nature rises in response--almost in a moment, almost in the twinkling of an eye? Let the card continue to depict, for those who can see no further, the Last judgment and the resurrection in the natural body; but let those who have inward eyes look and discover therewith. They will understand that it has been called truly in the past a card of eternal life, and for this reason it may be compared with that which passes under the name of Temperance."}, {"type": "major", "name_short": "ar00", "name": "The Fool", "value": "ZERO", "meaning_up": "Folly, mania, extravagance, intoxication, delirium, frenzy, bewrayment.", "meaning_rev": "Negligence, absence, distribution, carelessness, apathy, nullity, vanity.", "desc": "With light step, as if earth and its trammels had little power to restrain him, a young man in gorgeous vestments pauses at the brink of a precipice among the great heights of the world; he surveys the blue distance before him-its expanse of sky rather than the prospect below. His act of eager walking is still indicated, though he is stationary at the given moment; his dog is still bounding. The edge which opens on the depth has no terror; it is as if angels were waiting to uphold him, if it came about that he leaped from the height. His countenance is full of intelligence and expectant dream. He has a rose in one hand and in the other a costly wand, from which depends over his right shoulder a wallet curiously embroidered. He is a prince of the other world on his travels through this one-all amidst the morning glory, in the keen air. The sun, which shines behind him, knows whence he came, whither he is going, and how he will return by another path after many days. He is the spirit in search of experience. Many symbols of the Instituted Mysteries are summarized in this card, which reverses, under high warrants, all the confusions that have preceded it.\nIn his Manual of Cartomancy, Grand Orient has a curious suggestion of the office of Mystic Fool, as apart of his process in higher divination; but it might call for more than ordinary gifts to put it into operation. We shall see how the card fares according to the common arts of fortune-telling, and it will be an example, to those who can discern, of the fact, otherwise so evident, that the Trumps Major had no place originally in the arts of psychic gambling, when cards are used as the counters and pretexts. Of the circumstances under which this art arose we know, however, very little. The conventional explanations say that the Fool signifies the flesh, the sensitive life, and by a peculiar satire its subsidiary name was at one time the alchemist, as depicting folly at the most insensate stage."}, {"type": "major", "name_short": "ar21", "name": "The World", "value": "21", "meaning_up": "Assured success, recompense, voyage, route, emigration, flight, change of place.", "meaning_rev": "Inertia, fixity, stagnation, permanence.", "desc": "As this final message of the Major Trumps is unchanged--and indeed unchangeable--in respect of its design, it has been partly described already regarding its deeper sense. It represents also the perfection and end of the Cosmos, the secret which is within it, the rapture of the universe when it understands itself in God. It is further the state of the soul in the consciousness of Divine Vision, reflected from the self-knowing spirit. But these meanings are without prejudice to that which I have said concerning it on the material side.\nIt has more than one message on the macrocosmic side and is, for example, the state of the restored world when the law of manifestation shall have been carried to the highest degree of natural perfection. But it is perhaps more especially a story of the past, referring to that day when all was declared to be good, when the morning stars sang together and all the Sons of God shouted for joy. One of the worst explanations concerning it is that the figure symbolizes the Magus when he has reached the highest degree of initiation; another account says that it represents the absolute, which is ridiculous. The figure has been said to stand for Truth, which is, however, more properly allocated to the seventeenth card. Lastly, it has been called the Crown of the Magi."}, {"type": "minor", "name_short": "wapa", "name": "Page of Wands", "value": "page", "meaning_up": "Dark young man, faithful, a lover, an envoy, a postman. Beside a man, he will bear favourable testimony concerning him. A dangerous rival, if followed by the Page of Cups. Has the chief qualities of his suit. He may signify family intelligence.", "meaning_rev": "Anecdotes, announcements, evil news. Also indecision and the instability which accompanies it.", "desc": "In a scene similar to the former, a young man stands in the act of proclamation. He is unknown but faithful, and his tidings are strange."}, {"type": "minor", "name_short": "wakn", "name": "Knight of Wands", "value": "knight", "meaning_up": "Departure, absence, flight, emigration. A dark young man, friendly. Change of residence.", "meaning_rev": "Rupture, division, interruption, discord.", "desc": "He is shewn as if upon a journey, armed with a short wand, and although mailed is not on a warlike errand. He is passing mounds or pyramids. The motion of the horse is a key to the character of its rider, and suggests the precipitate mood, or things connected therewith."}, {"type": "minor", "name_short": "waqu", "name": "Queen of Wands", "value": "queen", "meaning_up": "A dark woman, countrywoman, friendly, chaste, loving, honourable. If the card beside her signifies a man, she is well disposed towards him; if a woman, she is interested in the Querent. Also, love of money, or a certain success in business.", "meaning_rev": "Good, economical, obliging, serviceable. Signifies also--but in certain positions and in the neighbourhood of other cards tending in such directions--opposition, jealousy, even deceit and infidelity.", "desc": "The Wands throughout this suit are always in leaf, as it is a suit of life and animation. Emotionally and otherwise, the Queen's personality corresponds to that of the King, but is more magnetic."}, {"type": "minor", "name_short": "waki", "name": "King of Wands", "value": "king", "meaning_up": "Dark man, friendly, countryman, generally married, honest and conscientious. The card always signifies honesty, and may mean news concerning an unexpected heritage to fall in before very long.", "meaning_rev": "Good, but severe; austere, yet tolerant.", "desc": "The physical and emotional nature to which this card is attributed is dark, ardent, lithe, animated, impassioned, noble. The King uplifts a flowering wand, and wears, like his three correspondences in the remaining suits, what is called a cap of maintenance beneath his crown. He connects with the symbol of the lion, which is emblazoned on the back of his throne."}, {"type": "minor", "name_short": "waac", "name": "Ace of Wands", "value": "ace", "meaning_up": "Creation, invention, enterprise, the powers which result in these; principle, beginning, source; birth, family, origin, and in a sense the virility which is behind them; the starting point of enterprises; according to another account, money, fortune, inheritance.", "meaning_rev": "Fall, decadence, ruin, perdition, to perish also a certain clouded joy.", "desc": "A hand issuing from a cloud grasps a stout wand or club."}, {"type": "minor", "name_short": "wa02", "name": "Two of Wands", "value": "two", "meaning_up": "Between the alternative readings there is no marriage possible; on the one hand, riches, fortune, magnificence; on the other, physical suffering, disease, chagrin, sadness, mortification. The design gives one suggestion; here is a lord overlooking his dominion and alternately contemplating a globe; it looks like the malady, the mortification, the sadness of Alexander amidst the grandeur of this world's wealth.", "meaning_rev": "Surprise, wonder, enchantment, emotion, trouble, fear.", "desc": "A tall man looks from a battlemented roof over sea and shore; he holds a globe in his right hand, while a staff in his left rests on the battlement; another is fixed in a ring. The Rose and Cross and Lily should be noticed on the left side."}, {"type": "minor", "name_short": "wa03", "name": "Three of Wands", "value": "three", "meaning_up": "He symbolizes established strength, enterprise, effort, trade, commerce, discovery; those are his ships, bearing his merchandise, which are sailing over the sea. The card also signifies able co-operation in business, as if the successful merchant prince were looking from his side towards yours with a view to help you.", "meaning_rev": "The end of troubles, suspension or cessation of adversity, toil and disappointment.", "desc": "A calm, stately personage, with his back turned, looking from a cliff's edge at ships passing over the sea. Three staves are planted in the ground, and he leans slightly on one of them."}, {"type": "minor", "name_short": "wa04", "name": "Four of Wands", "value": "four", "meaning_up": "They are for once almost on the surface--country life, haven of refuge, a species of domestic harvest-home, repose, concord, harmony, prosperity, peace, and the perfected work of these.", "meaning_rev": "The meaning remains unaltered; it is prosperity, increase, felicity, beauty, embellishment.", "desc": "From the four great staves planted in the foreground there is a great garland suspended; two female figures uplift nosegays; at their side is a bridge over a moat, leading to an old manorial house."}, {"type": "minor", "name_short": "wa05", "name": "Five of Wands", "value": "five", "meaning_up": "Imitation, as, for example, sham fight, but also the strenuous competition and struggle of the search after riches and fortune. In this sense it connects with the battle of life. Hence some attributions say that it is a card of gold, gain, opulence.", "meaning_rev": "Litigation, disputes, trickery, contradiction.", "desc": "A posse of youths, who are brandishing staves, as if in sport or strife. It is mimic warfare, and hereto correspond the"}, {"type": "minor", "name_short": "wa06", "name": "Six of Wands", "value": "six", "meaning_up": "The card has been so designed that it can cover several significations; on the surface, it is a victor triumphing, but it is also great news, such as might be carried in state by the King's courier; it is expectation crowned with its own desire, the crown of hope, and so forth.", "meaning_rev": "Apprehension, fear, as of a victorious enemy at the gate; treachery, disloyalty, as of gates being opened to the enemy; also indefinite delay.", "desc": "A laurelled horseman bears one staff adorned with a laurel crown; footmen with staves are at his side."}, {"type": "minor", "name_short": "wa07", "name": "Seven of Wands", "value": "seven", "meaning_up": "It is a card of valour, for, on the surface, six are attacking one, who has, however, the vantage position. On the intellectual plane, it signifies discussion, wordy strife; in business--negotiations, war of trade, barter, competition. It is further a card of success, for the combatant is on the top and his enemies may be unable to reach him.", "meaning_rev": "Perplexity, embarrassments, anxiety. It is also a caution against indecision.", "desc": "A young man on a craggy eminence brandishing a staff; six other staves are raised towards him from below."}, {"type": "minor", "name_short": "wa08", "name": "Eight of Wands", "value": "eight", "meaning_up": "Activity in undertakings, the path of such activity, swiftness, as that of an express messenger; great haste, great hope, speed towards an end which promises assured felicity; generally, that which is on the move; also the arrows of love.", "meaning_rev": "Arrows of jealousy, internal dispute, stingings of conscience, quarrels; and domestic disputes for persons who are married.", "desc": "The card represents motion through the immovable-a flight of wands through an open country; but they draw to the term of their course. That which they signify is at hand; it may be even on the threshold."}, {"type": "minor", "name_short": "wa09", "name": "Nine of Wands", "value": "nine", "meaning_up": "The card signifies strength in opposition. If attacked, the person will meet an onslaught boldly; and his build shews, that he may prove a formidable antagonist. With this main significance there are all its possible adjuncts--delay, suspension, adjournment.", "meaning_rev": "Obstacles, adversity, calamity.", "desc": "The figure leans upon his staff and has an expectant look, as if awaiting an enemy. Behind are eight other staves--erect, in orderly disposition, like a palisade."}, {"type": "minor", "name_short": "wa10", "name": "Ten of Wands", "value": "ten", "meaning_up": "A card of many significances, and some of the readings cannot be harmonized. I set aside that which connects it with honour and good faith. The chief meaning is oppression simply, but it is also fortune, gain, any kind of success, and then it is the oppression of these things. It is also a card of false-seeming, disguise, perfidy. The place which the figure is approaching may suffer from the rods that he carries. Success is stultified if the Nine of Swords follows, and if it is a question of a lawsuit, there will be certain loss.", "meaning_rev": "Contrarieties, difficulties, intrigues, and their analogies.", "desc": "A man oppressed by the weight of the ten staves which he is carrying."}, {"type": "minor", "name_short": "cupa", "name": "Page of Cups", "value": "page", "meaning_up": "Fair young man, one impelled to render service and with whom the Querent will be connected; a studious youth; news, message; application, reflection, meditation; also these things directed to business.", "meaning_rev": "Taste, inclination, attachment, seduction, deception, artifice.", "desc": "A fair, pleasing, somewhat effeminate page, of studious and intent aspect, contemplates a fish rising from a cup to look at him. It is the pictures of the mind taking form."}, {"type": "minor", "name_short": "cukn", "name": "Knight of Cups", "value": "knight", "meaning_up": "Arrival, approach--sometimes that of a messenger; advances, proposition, demeanour, invitation, incitement.", "meaning_rev": "Trickery, artifice, subtlety, swindling, duplicity, fraud.", "desc": "Graceful, but not warlike; riding quietly, wearing a winged helmet, referring to those higher graces of the imagination which sometimes characterize this card. He too is a dreamer, but the images of the side of sense haunt him in his vision."}, {"type": "minor", "name_short": "cuqu", "name": "Queen of Cups", "value": "queen", "meaning_up": "Good, fair woman; honest, devoted woman, who will do service to the Querent; loving intelligence, and hence the gift of vision; success, happiness, pleasure; also wisdom, virtue; a perfect spouse and a good mother.", "meaning_rev": "The accounts vary; good woman; otherwise, distinguished woman but one not to be trusted; perverse woman; vice, dishonour, depravity.", "desc": "Beautiful, fair, dreamy--as one who sees visions in a cup. This is, however, only one of her aspects; she sees, but she also acts, and her activity feeds her dream."}, {"type": "minor", "name_short": "cuki", "name": "King of Cups", "value": "king", "meaning_up": "Fair man, man of business, law, or divinity; responsible, disposed to oblige the Querent; also equity, art and science, including those who profess science, law and art; creative intelligence.", "meaning_rev": "Dishonest, double-dealing man; roguery, exaction, injustice, vice, scandal, pillage, considerable loss.", "desc": "He holds a short sceptre in his left hand and a great cup in his right; his throne is set upon the sea; on one side a ship is riding and on the other a dolphin is leaping. The implicit is that the Sign of the Cup naturally refers to water, which appears in all the court cards."}, {"type": "minor", "name_short": "cuac", "name": "Ace of Cups", "value": "ace", "meaning_up": "House of the true heart, joy, content, abode, nourishment, abundance, fertility; Holy Table, felicity hereof.", "meaning_rev": "House of the false heart, mutation, instability, revolution.", "desc": "The waters are beneath, and thereon are water-lilies; the hand issues from the cloud, holding in its palm the cup, from which four streams are pouring; a dove, bearing in its bill a cross-marked Host, descends to place the Wafer in the Cup; the dew of water is falling on all sides. It is an intimation of that which may lie behind the Lesser Arcana."}, {"type": "minor", "name_short": "cu02", "name": "Two of Cups", "value": "two", "meaning_up": "Love, passion, friendship, affinity, union, concord, sympathy, the interrelation of the sexes, and--as a suggestion apart from all offices of divination--that desire which is not in Nature, but by which Nature is sanctified.", "meaning_rev": "Lust, cupidity, jealousy, wish, desire, but the card may also give, says W., \"that desire which is not in nature, but by which nature is sanctified.\"", "desc": "A youth and maiden are pledging one another, and above their cups rises the Caduceus of Hermes, between the great wings of which there appears a lion's head. It is a variant of a sign which is found in a few old examples of this card. Some curious emblematical meanings are attached to it, but they do not concern us in this place."}, {"type": "minor", "name_short": "cu03", "name": "Three of Cups", "value": "three", "meaning_up": "The conclusion of any matter in plenty, perfection and merriment; happy issue, victory, fulfilment, solace, healing,", "meaning_rev": "Expedition, dispatch, achievement, end. It signifies also the side of excess in physical enjoyment, and the pleasures of the senses.", "desc": "Maidens in a garden-ground with cups uplifted, as if pledging one another."}, {"type": "minor", "name_short": "cu04", "name": "Four of Cups", "value": "four", "meaning_up": "Weariness, disgust, aversion, imaginary vexations, as if the wine of this world had caused satiety only; another wine, as if a fairy gift, is now offered the wastrel, but he sees no consolation therein. This is also a card of blended pleasure.", "meaning_rev": "Novelty, presage, new instruction, new relations.", "desc": "A young man is seated under a tree and contemplates three cups set on the grass before him; an arm issuing from a cloud offers him another cup. His expression notwithstanding is one of discontent with his environment."}, {"type": "minor", "name_short": "cu05", "name": "Five of Cups", "value": "five", "meaning_up": "A dark, cloaked figure, looking sideways at three prone cups two others stand upright behind him; a bridge is in the background, leading to a small keep or holding. Divanatory Meanings: It is a card of loss, but something remains over; three have been taken, but two are left; it is a card of inheritance, patrimony, transmission, but not corresponding to expectations; with some interpreters it is a card of marriage, but not without bitterness or frustration.", "meaning_rev": "News, alliances, affinity, consanguinity, ancestry, return, false projects.", "desc": "A dark, cloaked figure, looking sideways at three prone cups two others stand upright behind him; a bridge is in the background, leading to a small keep or holding. Divanatory Meanings: It is a card of loss, but something remains over; three have been taken, but two are left; it is a card of inheritance, patrimony, transmission, but not corresponding to expectations; with some interpreters it is a card of marriage, but not without bitterness or frustration. Reversed: News, alliances, affinity, consanguinity, ancestry, return, false projects"}, {"type": "minor", "name_short": "cu06", "name": "Six of Cups", "value": "six", "meaning_up": "A card of the past and of memories, looking back, as--for example--on childhood; happiness, enjoyment, but coming rather from the past; things that have vanished. Another reading reverses this, giving new relations, new knowledge, new environment, and then the children are disporting in an unfamiliar precinct.", "meaning_rev": "The future, renewal, that which will come to pass presently.", "desc": "Children in an old garden, their cups filled with flowers."}, {"type": "minor", "name_short": "cu07", "name": "Seven of Cups", "value": "seven", "meaning_up": "Fairy favours, images of reflection, sentiment, imagination, things seen in the glass of contemplation; some attainment in these degrees, but nothing permanent or substantial is suggested.", "meaning_rev": "Desire, will, determination, project.", "desc": "Strange chalices of vision, but the images are more especially those of the fantastic spirit."}, {"type": "minor", "name_short": "cu08", "name": "Eight of Cups", "value": "eight", "meaning_up": "The card speaks for itself on the surface, but other readings are entirely antithetical--giving joy, mildness, timidity, honour, modesty. In practice, it is usually found that the card shews the decline of a matter, or that a matter which has been thought to be important is really of slight consequence--either for good or evil.", "meaning_rev": "Great joy, happiness, feasting.", "desc": "A man of dejected aspect is deserting the cups of his felicity, enterprise, undertaking or previous concern."}, {"type": "minor", "name_short": "cu09", "name": "Nine of Cups", "value": "nine", "meaning_up": "Concord, contentment, physical bien-être; also victory, success, advantage; satisfaction for the Querent or person for whom the consultation is made.", "meaning_rev": "Truth, loyalty, liberty; but the readings vary and include mistakes, imperfections, etc.", "desc": "A goodly personage has feasted to his heart's content, and abundant refreshment of wine is on the arched counter behind him, seeming to indicate that the future is also assured. The picture offers the material side only, but there are other aspects."}, {"type": "minor", "name_short": "cu10", "name": "Ten of Cups", "value": "ten", "meaning_up": "Contentment, repose of the entire heart; the perfection of that state; also perfection of human love and friendship; if with several picture-cards, a person who is taking charge of the Querent's interests; also the town, village or country inhabited by the Querent.", "meaning_rev": "Repose of the false heart, indignation, violence.", "desc": "Appearance of Cups in a rainbow; it is contemplated in wonder and ecstacy by a man and woman below, evidently husband and wife. His right arm is about her; his left is raised upward; she raises her right arm. The two children dancing near them have not observed the prodigy but are happy after their own manner. There is a home-scene beyond."}, {"type": "minor", "name_short": "pepa", "name": "Page of Pentacles", "value": "page", "meaning_up": "Application, study, scholarship, reflection another reading says news, messages and the bringer thereof; also rule, management.", "meaning_rev": "Prodigality, dissipation, liberality, luxury; unfavourable news.", "desc": "A youthful figure, looking intently at the pentacle which hovers over his raised hands. He moves slowly, insensible of that which is about him."}, {"type": "minor", "name_short": "pekn", "name": "Knight of Pentacles", "value": "knight", "meaning_up": "Utility, serviceableness, interest, responsibility, rectitude-all on the normal and external plane.", "meaning_rev": "inertia, idleness, repose of that kind, stagnation; also placidity, discouragement, carelessness.", "desc": "He rides a slow, enduring, heavy horse, to which his own aspect corresponds. He exhibits his symbol, but does not look therein."}, {"type": "minor", "name_short": "pequ", "name": "Queen of Pentacles", "value": "queen", "meaning_up": "Opulence, generosity, magnificence, security, liberty.", "meaning_rev": "Evil, suspicion, suspense, fear, mistrust.", "desc": "The face suggests that of a dark woman, whose qualities might be summed up in the idea of greatness of soul; she has also the serious cast of intelligence; she contemplates her symbol and may see worlds therein."}, {"type": "minor", "name_short": "peki", "name": "King of Pentacles", "value": "king", "meaning_up": "Valour, realizing intelligence, business and normal intellectual aptitude, sometimes mathematical gifts and attainments of this kind; success in these paths.", "meaning_rev": "Vice, weakness, ugliness, perversity, corruption, peril.", "desc": "The figure calls for no special description the face is rather dark, suggesting also courage, but somewhat lethargic in tendency. The bull's head should be noted as a recurrent symbol on the throne. The sign of this suit is represented throughout as engraved or blazoned with the pentagram, typifying the correspondence of the four elements in human nature and that by which they may be governed. In many old Tarot packs this suit stood for current coin, money, deniers. I have not invented the substitution of pentacles and I have no special cause to sustain in respect of the alternative. But the consensus of divinatory meanings is on the side of some change, because the cards do not happen to deal especially with questions of money."}, {"type": "minor", "name_short": "peac", "name": "Ace of Pentacles", "value": "ace", "meaning_up": "Perfect contentment, felicity, ecstasy; also speedy intelligence; gold.", "meaning_rev": "The evil side of wealth, bad intelligence; also great riches. In any case it shews prosperity, comfortable material conditions, but whether these are of advantage to the possessor will depend on whether the card is reversed or not.", "desc": "A hand--issuing, as usual, from a cloud--holds up a pentacle."}, {"type": "minor", "name_short": "pe02", "name": "Two of Pentacles", "value": "two", "meaning_up": "On the one hand it is represented as a card of gaiety, recreation and its connexions, which is the subject of the design; but it is read also as news and messages in writing, as obstacles, agitation, trouble, embroilment.", "meaning_rev": "Enforced gaiety, simulated enjoyment, literal sense, handwriting, composition, letters of exchange.", "desc": "A young man, in the act of dancing, has a pentacle in either hand, and they are joined by that endless cord which is like the number 8 reversed."}, {"type": "minor", "name_short": "pe03", "name": "Three of Pentacles", "value": "three", "meaning_up": "Métier, trade, skilled labour; usually, however, regarded as a card of nobility, aristocracy, renown, glory.", "meaning_rev": "Mediocrity, in work and otherwise, puerility, pettiness, weakness.", "desc": "A
